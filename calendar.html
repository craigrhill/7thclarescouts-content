/* A programme year runs 1 September to 31 August. August still belongs to the
   year that is ending, not the one about to start: the national events that
   land then, the Phoenix Challenge and Duslan, are the tail of the outgoing
   year. So one boundary is used both for filing an event under a year and for
   deciding which year we are in today. */
var PROGRAMME_START_MONTH = 8;             // 0 = January, so 8 = September

function programmeYearOf(isoStr){
  var d = parseISO(isoStr);
  return d.getFullYear() - (d.getMonth() < PROGRAMME_START_MONTH ? 1 : 0);
}
function currentProgrammeYear(){ return programmeYearOf(todayISO()); }
function programmeYears(){
  var years = {};
  years[currentProgrammeYear()] = true;      // always offered, even if empty
  state.events.forEach(function(ev){
    var a = programmeYearOf(ev.start), b = programmeYearOf(ev.end || ev.start);
    for(var y=a; y<=b; y++) years[y] = true;
  });
  return Object.keys(years).map(Number).sort(function(a,b){ return a-b; });
}
function programmeLabel(y){
  return 'Programme year ' + y + '/' + String(y+1).slice(2) +
         '  (Sep ' + y + ' to Aug ' + (y+1) + ')' +
         (y === currentProgrammeYear() ? '  \u2014 current' : '');
}
/* Which year to open on. The year we are in wins while it still has something
   to come, which keeps August pointed at Phoenix and Duslan rather than at a
   year nobody has filled in yet. Once the current year has nothing left, it
   steps to the next year that does, so the dialog is never opened on an empty
   range in the planning months. */
function defaultPrintRange(){
  var cur = currentProgrammeYear(), today = todayISO();
  var hasEvents = {}, hasUpcoming = {};
  state.events.forEach(function(ev){
    var a = programmeYearOf(ev.start), b = programmeYearOf(ev.end || ev.start);
    var stillToCome = (ev.end || ev.start) >= today;
    for(var y=a; y<=b; y++){
      hasEvents[y] = true;
      if(stillToCome) hasUpcoming[y] = true;
    }
  });
  if(hasUpcoming[cur]) return 'py' + cur;
  var later = Object.keys(hasUpcoming).map(Number)
                .filter(function(y){ return y > cur; })
                .sort(function(a,b){ return a-b; });
  if(later.length) return 'py' + later[0];
  if(hasEvents[cur]) return 'py' + cur;
  return '12';
}

function printRange(){
  var today = parseISO(todayISO());
  if(printOpts.range === 'month'){
    var m = startOfMonth(printOpts.month ? parseISO(printOpts.month) : today);
    return { from: m, to: m, single: true };
  }
  if(printOpts.range === 'all'){
    var all = state.events.slice().sort(sortByDate);
    if(!all.length) return null;
    return { from: startOfMonth(parseISO(all[0].start)),
             to:   startOfMonth(parseISO(all[all.length-1].end || all[all.length-1].start)) };
  }
  var m = /^py(\d{4})$/.exec(printOpts.range);
  if(m){
    var y = +m[1];
    return { from: new Date(y, 8, 1), to: new Date(y+1, 7, 1) };
  }
  var from = startOfMonth(today);
  return { from: from, to: new Date(from.getFullYear(), from.getMonth()+11, 1) };
}

function printSheets(){
  if(printOpts.who === 'each') return SECTIONS.map(function(s){ return s.id; });
  return [printOpts.who];
}

/* Printing on iOS.

   An app added to the Home Screen runs without any Safari chrome, and with no
   chrome there is no print UI: window.print() there does nothing at all, throws
   nothing, and logs nothing. That is exactly the "I press Print and nothing
   happens" report, and it is not something the page can fix from inside the
   installed app. What it can do is hand the job to Safari, where printing works,
   by opening a link that carries the print choices with it.

   The old code also waited 60ms before calling print(). That detaches the call
   from the tap that caused it, and Safari is far stricter than Chrome about
   acting on a stale user gesture. It is called straight from the handler now. */
function printQuery(){
  var q = ['print=1', 'who=' + encodeURIComponent(printOpts.who),
           'range=' + encodeURIComponent(printOpts.range)];
  if(printOpts.month) q.push('month=' + encodeURIComponent(printOpts.month));
  if(printOpts.poster){ q.push('poster=1'); q.push('orient=' + printOpts.posterOrient); }
  return location.origin + location.pathname + '?' + q.join('&');
}

/* A home screen app on iOS cannot print. This is a WebKit limitation, reported
   on Apple's own developer forums since iOS 9 and still true: window.print()
   inside a standalone web app either does nothing or opens a preview that stays
   blank with the printer greyed out. There is no call the page can make to get
   around it.

   The first attempt at this handed the job to Safari with window.open(). That
   does not escape either: iOS keeps a link that is inside the app's own scope
   inside the app, so it landed back in the same place with the same dead button.

   So the app stops pretending. It says what is wrong, tries the hand-off anyway
   in case a future iOS allows it, and gives two things that definitely do work:
   copy the link, and the system share sheet. Safari prints this perfectly. */

  open.onclick = function(){

  row.appendChild(open);

  var copy = el('button','btn sec','Copy link');

    box.select();

    } else { try{ document.execCommand('copy'); done(); }catch(e){} }

  row.appendChild(copy);

  if(navigator.share){

function doPrint(msg){
  if(isIOS() && isStandalone()){ iosPrintHelp(); return false; }
  try { window.print(); }
  catch(e){
    if(msg){ msg.className='err'; msg.textContent='This browser would not open a print dialog. Try Safari, Chrome, or a computer.'; }
    return false;
  }

}

/* Arriving from the link above: set the choices up, build the sheet, and put a
   bar at the top so the next tap is a real user gesture in Safari. */
function maybePrintView(){
  var q;
  try { q = new URLSearchParams(location.search); } catch(e){ return; }
  if(q.get('print') !== '1') return;

  printOpts.who    = q.get('who') || 'all';
  printOpts.range  = q.get('range') || '12';
  printOpts.month  = q.get('month') || null;
  printOpts.poster = q.get('poster') === '1';
  printOpts.posterOrient = q.get('orient') === 'landscape' ? 'landscape' : 'portrait';

  var bar = el('div','printbar');
  var txt = el('div','pbtxt');
  txt.appendChild(el('b', null, 'Ready to print'));
  txt.appendChild(el('span', null,
    (printOpts.who === 'all' ? 'All sections' :
     printOpts.who === 'each' ? 'Every section' :
     (SEC_BY_ID[printOpts.who] ? SEC_BY_ID[printOpts.who].name : printOpts.who)) +
    (printOpts.poster ? ' · A3 poster, ' + printOpts.posterOrient : '')));
  bar.appendChild(txt);

  /* Still inside the home screen app means the hand-off to Safari did not
     escape, and a Print button here would be as dead as the one that sent us.
     Offer the link instead of a button that cannot work. */
  var stuck = isIOS() && isStandalone();

  if(stuck){
    var copy = el('button','btn','Copy link for Safari');
    copy.onclick = function(){
      var u = location.href;
      var ok = function(){ copy.textContent = 'Copied, now paste it in Safari'; };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(u).then(ok, function(){});
      }
    };
    bar.appendChild(copy);
    bar.appendChild(el('p','pbnote','A home screen app on iPhone cannot open a print dialog. Paste this link into Safari and press Print there, or print from a computer.'));
  } else {
    var go = el('button','btn','Print');
    go.onclick = function(){
      if(!buildPrintout()){ toast('Nothing to print in that range'); return; }
      try { window.print(); } catch(e){ toast('Use Share, then Print'); }
    };
    bar.appendChild(go);
    bar.appendChild(el('p','pbnote','If nothing opens, use the Share button below, then Print or Save to Files.'));
  }
  document.body.insertBefore(bar, document.body.firstChild);
  buildPrintout();
}

function setPaper(size){
  var tag = document.getElementById('paperCss');
  if(!tag){
    tag = document.createElement('style');
    tag.id = 'paperCss';
    document.head.appendChild(tag);
  }
  tag.textContent = size ? '@media print{@page{size:' + size + ';margin:8mm}}' : '';
}

function buildPrintout(){
  var host = $('printout'); host.innerHTML = '';
  var range = printRange();
  if(!range) return 0;

  var stamp = new Date().toLocaleDateString('en-IE', {day:'numeric', month:'long', year:'numeric'});
  var badge = document.querySelector('.mark img');
  var total = 0;

  /* Named @page rules are not reliable across browsers, so the paper size is
     swapped wholesale for the poster instead. The user still has to pick A3 in
     the print dialog on most printers; this at least gets the geometry right in
     "Save as PDF", which is how most of these will actually be produced. */
  setPaper(printOpts.poster && !range.single ? 'A3 ' + printOpts.posterOrient : '');
  posterHidden = 0;

  printSheets().forEach(function(who){
    var list = state.events.filter(function(ev){
      if(who !== 'all'){
        var secs = secsOf(ev);
        if(secs.indexOf(who) === -1) return false;
      }
      var s = startOfMonth(parseISO(ev.start));
      return s <= range.to && startOfMonth(parseISO(ev.end || ev.start)) >= range.from;
    }).sort(sortByDate);

    if(printOpts.who === 'each' && !list.length) return;      // skip empty sections
    total += list.length;

    var sheet = el('div','psheet');

    var head = el('div','phead');
    if(badge){ var img = document.createElement('img'); img.src = badge.src; img.alt=''; head.appendChild(img); }
    var titles = el('div');
    titles.appendChild(el('h1', null, '7th Clare Scouts'));
    titles.appendChild(el('p', null, 'Ballyvaughan, Co. Clare'));
    head.appendChild(titles);
    var who2 = el('div','pwho', who === 'all' ? 'All Sections' : SEC_BY_ID[who].name);
    who2.appendChild(el('small', null, monthLabelShort(range.from) + ' to ' + monthLabelShort(range.to)));
    head.appendChild(who2);
    sheet.appendChild(head);

    /* The key goes on every sheet, not just the all-sections one. A Cubs sheet
       still carries whole-group and joint events, and without a key their blue
       and striped marks are unexplained. */
    var key = el('div','pkey');
    function keyItem(paint, label){
      var item = el('span');
      var sw = el('i'); sw.style.background = paint;
      item.appendChild(sw); item.appendChild(document.createTextNode(label));
      key.appendChild(item);
    }
    (who === 'all' ? SECTIONS : SECTIONS.filter(function(s){ return s.id === who; }))
      .forEach(function(sec){ keyItem(sec.colour, sec.name); });
    keyItem(stripePaint(SECTIONS.map(function(s){ return s.id; })), 'Whole group (all ' + SECTIONS.length + ')');
    keyItem(stripePaint(SECTIONS.slice(1,3).map(function(s){ return s.id; })), 'Two or more sections');
    sheet.appendChild(key);

    if(printOpts.poster && !range.single){
      sheet.className = 'psheet a3sheet';
      var poster = el('div','poster');
      var posterInner = el('div','posterScale ' + (printOpts.posterOrient === 'portrait' ? 'pport' : 'pland'));
      poster.appendChild(posterInner);
      var pc = new Date(range.from);
      var pg = 0;
      while(pc <= range.to && pg++ < 24){
        posterInner.appendChild(printPosterMonth(pc, list));
        pc = new Date(pc.getFullYear(), pc.getMonth()+1, 1);
      }
      sheet.appendChild(poster);
      var pf = el('div','pfoot');
      pf.appendChild(el('span', null, 'Printed ' + stamp +
        (posterHidden ? ', ' + posterHidden + ' event' + (posterHidden===1?'':'s') +
                        ' would not fit; print the A4 version for the full list' : '')));
      pf.appendChild(el('span', null, addrForPrint()));
      sheet.appendChild(pf);
      host.appendChild(sheet);
      return;
    }

    if(range.single){
      sheet.appendChild(printBigMonth(range.from, list, who));
    } else {
      var months = el('div','pmonths');
      var cur = new Date(range.from);
      var guard = 0;
      while(cur <= range.to && guard++ < 36){
        months.appendChild(printMonth(cur, list));
        cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
      }
      sheet.appendChild(months);
    }

    if(range.single){
      var f2b = el('div','pfoot');
      f2b.appendChild(el('span', null, 'Printed ' + stamp));
      f2b.appendChild(el('span', null, addrForPrint()));
      sheet.appendChild(f2b);
      host.appendChild(sheet);
      return;
    }

    var listBox = el('div','plist');
    listBox.appendChild(el('h3', null, 'Events'));
    if(!list.length){
      listBox.appendChild(el('p','pempty','Nothing on the calendar for this section in this period.'));
    } else {
      listBox.appendChild(printTable(list, who));
    }
    sheet.appendChild(listBox);

    var foot = el('div','pfoot');
    foot.appendChild(el('span', null, 'Printed ' + stamp));
    foot.appendChild(el('span', null, siteAddress()));
    sheet.appendChild(foot);

    host.appendChild(sheet);
  });
  return total;
}

function monthLabelShort(d){ return MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getFullYear(); }

/* One month sized for the A3 poster: same lane packing, but the bars carry the
   event name rather than just marking the day. */
/* A day cell on the poster holds three events. Anything beyond that is counted
   so the sheet can say so rather than quietly losing it. */
var posterHidden = 0;

/* ---- how a printed bar is coloured -------------------------------------

   The poster and the wall sheet write the event name inside the bar, so the
   fill has to stay pale enough for black text. The identity therefore lives in
   a solid mark down the left edge, painted as a background image rather than a
   border, because a border cannot carry more than one colour.

   One section  → that section's colour.
   Two or more  → a hard-stop stripe of the sections involved, the same way the
                  calendar on screen shows a joint event.
   Whole group → falls out of that rule as a stripe of every section, which says
                  "every section" without needing a key at all. County blue was
                  the obvious alternative until it turned out to be the exact
                  hex the Scouts already use (#1F409B), so it would have been
                  indistinguishable from a Scouts-only event. */
var PRINT_NEUTRAL = '#eef2f7';

function isWholeCounty(secs){ return secs.length >= SECTIONS.length; }

function solidPaint(c){ return 'linear-gradient(180deg,' + c + ' 0%,' + c + ' 100%)'; }

function stripePaint(secs){
  var n = secs.length, stops = [];
  secs.forEach(function(id, i){
    stops.push(SEC_BY_ID[id].colour + ' ' + (i*100/n).toFixed(2) + '% ' + ((i+1)*100/n).toFixed(2) + '%');
  });
  return 'linear-gradient(180deg,' + stops.join(',') + ')';
}

function printEdge(secs){
  return secs.length === 1 ? solidPaint(SEC_BY_ID[secs[0]].colour) : stripePaint(secs);
}

/* The wash behind the name has to stay pale enough for black text, and there is
   no single colour to wash with once more than one section is involved. */
function printFill(secs){
  return secs.length === 1 ? sectionTint(secs, '--chip-tint') : PRINT_NEUTRAL;
}

function paintPrintBar(bar, secs, clippedLeft, edge, gap){
  bar.style.backgroundColor = printFill(secs);
  if(clippedLeft) return;          /* the mark belongs at the real start, not on a continuation */
  bar.style.backgroundImage  = printEdge(secs);
  bar.style.backgroundRepeat = 'no-repeat';
  bar.style.backgroundSize   = edge + ' 100%';
  bar.style.paddingLeft      = 'calc(' + edge + ' + ' + (gap || '.45mm') + ')';
}

function printPosterMonth(monthDate, list){
  /* Deliberately NOT 'pmonth': that class carries the A4 planner's own
     '.pmonth h3{font-size:9pt}', which outspecifies .poh and, once the poster
     started scaling by half, rendered every month heading at 4.5pt. .pomonth
     already sets break-inside itself, which was the only reason for sharing. */
  var box = el('div','pomonth');
  box.appendChild(el('h3','poh', MONTHS[monthDate.getMonth()] + ' ' + monthDate.getFullYear()));

  var dows = el('div','podows');
  ['M','T','W','T','F','S','S'].forEach(function(d){ dows.appendChild(el('span',null,d)); });
  box.appendChild(dows);

  var first = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  var offset = (first.getDay()+6)%7;
  var gridStart = new Date(first); gridStart.setDate(1-offset);
  var last = new Date(monthDate.getFullYear(), monthDate.getMonth()+1, 0);
  var weeks = Math.ceil((offset + last.getDate())/7);
  var monthStartISO = iso(first), monthEndISO = iso(last);

  var weeksBox = el('div','poweeks');
  for(var w=0; w<weeks; w++){
    var weekStart = addDays(gridStart, w*7);
    var wsISO = iso(weekStart), weISO = iso(addDays(weekStart, 6));

    var week = el('div','poweek');
    var bg = el('div','pobg');
    for(var i=0;i<7;i++){
      var d = addDays(weekStart, i);
      bg.appendChild(el('i', d.getMonth()!==monthDate.getMonth() ? 'poout' : null));
    }
    week.appendChild(bg);

    var wg = el('div','pogrid');
    for(var i=0;i<7;i++){
      var d = addDays(weekStart, i);
      var n = el('span','ponum'+(d.getMonth()!==monthDate.getMonth()?' out':''), String(d.getDate()));
      n.style.gridColumn = String(i+1);
      wg.appendChild(n);
    }

    var items = list.filter(function(ev){
      return ev.start <= weISO && (ev.end||ev.start) >= wsISO &&
             ev.start <= monthEndISO && (ev.end||ev.start) >= monthStartISO;
    }).map(function(ev){
      var evEnd = ev.end || ev.start;
      var a = ev.start > wsISO ? ev.start : wsISO;
      if(a < monthStartISO) a = monthStartISO;
      var bb = evEnd < weISO ? evEnd : weISO;
      if(bb > monthEndISO) bb = monthEndISO;
      if(a > bb) return null;
      return { ev:ev, c1:dayGap(weekStart,a)+1, c2:dayGap(weekStart,bb)+1,
               clipL: ev.start < a, clipR: evEnd > bb };
    }).filter(Boolean).sort(function(a,b){
      if(a.c1 !== b.c1) return a.c1 - b.c1;
      return (b.c2-b.c1) - (a.c2-a.c1);
    });

    var lanes = [];
    items.forEach(function(it){
      var lane = 0;
      while(lane < 3){
        var taken = (lanes[lane]||[]).some(function(r){ return it.c1 <= r.c2 && it.c2 >= r.c1; });
        if(!taken) break;
        lane++;
      }
      if(lane >= 3){ posterHidden++; return; }   /* owned up to in the footer */
      (lanes[lane] = lanes[lane] || []).push(it);

      var bar = el('div','pobar'+(it.clipL?' cl':'')+(it.clipR?' cr':''));
      paintPrintBar(bar, secsOf(it.ev), it.clipL, '1.4mm', '.9mm');   /* doubled: the poster is drawn at 2x */
      bar.appendChild(el('span','pobartxt', it.ev.name));
      bar.style.gridColumn = it.c1 + ' / span ' + (it.c2 - it.c1 + 1);
      bar.style.gridRow = String(lane + 2);
      wg.appendChild(bar);
    });
    if(lanes.length > 2) week.className = 'poweek tight';
    else if(lanes.length <= 1) week.className = 'poweek roomy';

    week.appendChild(wg);
    weeksBox.appendChild(week);
  }
  box.appendChild(weeksBox);
  return box;
}
function addrForPrint(){ return siteAddress(); }

/* One month filling the page, with the event names written in, for pinning to
   a noticeboard. No table underneath: it is all in the grid. */
function printBigMonth(monthDate, list, who){

  var last = new Date(monthDate.getFullYear(), monthDate.getMonth()+1, 0);
  var weeks = Math.ceil((offset + last.getDate())/7);
  var monthStartISO = iso(first), monthEndISO = iso(last);

  var weeksBox = el('div','bigweeks');
  weeksBox.style.gridTemplateRows = 'repeat(' + weeks + ', 1fr)';

  for(var w=0; w<weeks; w++){

    var wsISO = iso(weekStart), weISO = iso(addDays(weekStart, 6));

    var week = el('div','bigweek');
    var bg = el('div','bigbg');
    for(var i=0;i<7;i++){
      var d = addDays(weekStart, i);
      bg.appendChild(el('i', d.getMonth()!==monthDate.getMonth() ? 'bigout' : null));
    }
    week.appendChild(bg);

    var wg = el('div','biggrid');
    for(var i=0;i<7;i++){
      var d = addDays(weekStart, i);
      var n = el('span','bignum'+(d.getMonth()!==monthDate.getMonth()?' out':''), String(d.getDate()));
      n.style.gridColumn = String(i+1);
      wg.appendChild(n);
    }

    var items = list.filter(function(ev){
      return ev.start <= weISO && (ev.end||ev.start) >= wsISO &&
             ev.start <= monthEndISO && (ev.end||ev.start) >= monthStartISO;
    }).map(function(ev){
      var evEnd = ev.end || ev.start;
      var a = ev.start > wsISO ? ev.start : wsISO;
      if(a < monthStartISO) a = monthStartISO;
      var bb = evEnd < weISO ? evEnd : weISO;
      if(bb > monthEndISO) bb = monthEndISO;
      if(a > bb) return null;
      return { ev:ev, c1:dayGap(weekStart,a)+1, c2:dayGap(weekStart,bb)+1,

    }).filter(Boolean).sort(function(a,b){
      if(a.c1 !== b.c1) return a.c1 - b.c1;
      return (b.c2-b.c1) - (a.c2-a.c1);
    });

    var lanes = [];
    items.forEach(function(it){
      var lane = 0;
      while(lane < 5){
        var taken = (lanes[lane]||[]).some(function(r){ return it.c1 <= r.c2 && it.c2 >= r.c1; });
        if(!taken) break;
        lane++;
      }
      if(lane >= 5) return;
      (lanes[lane] = lanes[lane] || []).push(it);

      var bar = el('div','bigbar'+(it.clipL?' cl':'')+(it.clipR?' cr':''));
      paintPrintBar(bar, secsOf(it.ev), it.clipL, '1.2mm', '.45mm');
      var t = el('span','bigbartxt', it.ev.name);
      if(it.ev.time) t.appendChild(el('em', null, '  ' + it.ev.time));
      bar.appendChild(t);
      bar.style.gridColumn = it.c1 + ' / span ' + (it.c2 - it.c1 + 1);
      bar.style.gridRow = String(lane + 2);
      wg.appendChild(bar);
    });

    // a busy week gets one line per event rather than two, so nothing is clipped
    if(lanes.length > 2) week.className = 'bigweek tight';

    week.appendChild(wg);
    weeksBox.appendChild(week);
  }
  box.appendChild(weeksBox);
  return box;
}

var PRINT_LANES = 3;

// Same lane packing as the on-screen calendar, drawn small enough for A4.
function printMonth(monthDate, list){
  var box = el('div','pmonth');
  box.appendChild(el('h3', null, MONTHS[monthDate.getMonth()] + ' ' + monthDate.getFullYear()));

  var dows = el('div','pdows');
  ['M','T','W','T','F','S','S'].forEach(function(d){ dows.appendChild(el('span',null,d)); });
  box.appendChild(dows);

  var first = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  var offset = (first.getDay()+6)%7;
  var gridStart = new Date(first); gridStart.setDate(1-offset);
  var last = new Date(monthDate.getFullYear(), monthDate.getMonth()+1, 0);
  var weeks = Math.ceil((offset + last.getDate())/7);
  var tISO = todayISO();
  var monthStartISO = iso(first), monthEndISO = iso(last);

  var weeksBox = el('div','pweeks');
  for(var w=0; w<weeks; w++){
    var weekStart = addDays(gridStart, w*7);
    var wsISO = iso(weekStart), weISO = iso(addDays(weekStart, 6));

    var week = el('div','pweek');
    var bg = el('div','pwbg');
    for(var i=0;i<7;i++){
      var d = addDays(weekStart, i);
      bg.appendChild(el('i', d.getMonth()!==monthDate.getMonth() ? 'pwout' : null));
    }
    week.appendChild(bg);

    var wg = el('div','pwgrid');
    for(var i=0;i<7;i++){
      var d = addDays(weekStart, i), key = iso(d);
      var n = el('span','pdnum'+(d.getMonth()!==monthDate.getMonth()?' pout':'')+(key===tISO?' ptoday':''),
                 String(d.getDate()));
      n.style.gridColumn = String(i+1);
      wg.appendChild(n);
    }

    // Bars are clamped to this month as well as this week, so an event that
    // runs over a month end draws in both months rather than bleeding into
    // the greyed-out days of the neighbouring grid.
    var items = list.filter(function(ev){
      return ev.start <= weISO && (ev.end||ev.start) >= wsISO &&
             ev.start <= monthEndISO && (ev.end||ev.start) >= monthStartISO;
    }).map(function(ev){
      var evEnd = ev.end || ev.start;
      var a = ev.start > wsISO ? ev.start : wsISO;
      if(a < monthStartISO) a = monthStartISO;
      var b = evEnd < weISO ? evEnd : weISO;
      if(b > monthEndISO) b = monthEndISO;
      if(a > b) return null;
      return { ev:ev, c1:dayGap(weekStart,a)+1, c2:dayGap(weekStart,b)+1,
               clipL: ev.start < a, clipR: evEnd > b };
    }).filter(Boolean).sort(function(a,b){
      if(a.c1 !== b.c1) return a.c1 - b.c1;
      return (b.c2-b.c1) - (a.c2-a.c1);
    });

    var lanes = [];
    items.forEach(function(it){
      var lane = 0;
      while(lane < PRINT_LANES){
        var taken = (lanes[lane]||[]).some(function(r){ return it.c1 <= r.c2 && it.c2 >= r.c1; });
        if(!taken) break;
        lane++;
      }
      if(lane >= PRINT_LANES) return;          // the table underneath still lists it
      (lanes[lane] = lanes[lane] || []).push(it);

      var bar = el('div','pbar'+(it.clipL?' pcl':'')+(it.clipR?' pcr':''));
      bar.style.background = sectionPaint(secsOf(it.ev));
      bar.style.gridColumn = it.c1 + ' / span ' + (it.c2 - it.c1 + 1);
      bar.style.gridRow = String(lane + 2);
      wg.appendChild(bar);
    });

    week.appendChild(wg);
    weeksBox.appendChild(week);
  }
  box.appendChild(weeksBox);
  return box;
}

/* ---------------------------------------------------------------- ics */
function icsDate(s, plusDays){
  var d=parseISO(s); if(plusDays) d.setDate(d.getDate()+plusDays);
  return iso(d).replace(/-/g,'');
}
function icsEscape(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
/* A timed event has to say which zone its hours are in, or a phone abroad puts
   it at the wrong hour. The zone is written into the file rather than named and
   left to the reader, which is what the subscription feed does too. */
var DUBLIN_VTZ=['BEGIN:VTIMEZONE','TZID:Europe/Dublin',
  'BEGIN:DAYLIGHT','TZOFFSETFROM:+0000','TZOFFSETTO:+0100','TZNAME:IST','DTSTART:19700329T010000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT',
  'BEGIN:STANDARD','TZOFFSETFROM:+0100','TZOFFSETTO:+0000','TZNAME:GMT','DTSTART:19701025T020000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD',
  'END:VTIMEZONE'];
function icsTime(t){ return /^([01]\d|2[0-3]):[0-5]\d$/.test(t||'') ? t : ''; }
function icsAt(d,t){ return icsDate(d)+'T'+t.replace(':','')+'00'; }
function icsHourAfter(t){ var h=+t.slice(0,2); return h>=23 ? '23:59' : ('0'+(h+1)).slice(-2)+':'+t.slice(3); }
function buildICS(list){
  var out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//7th Clare Scouts//Calendar//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:7th Clare Scouts'];
  if(list.some(function(ev){ return icsTime(ev.startTime); })) out=out.concat(DUBLIN_VTZ);
  list.forEach(function(ev){
    var desc=[];
    if(ev.description) desc.push(ev.description);
    if(ev.host) desc.push('Hosted by: '+ev.host);
    var c=[ev.contactName, ev.contactEmail, ev.contactPhone].filter(Boolean).join(' · ');
    if(c) desc.push('Contact: '+c);
    desc.push('Type: '+catName(ev.category));
    desc.push('Sections: '+sectionLabel(ev));
    if(ev.link) desc.push(ev.link);
    out.push('BEGIN:VEVENT');
    out.push('UID:'+ev.id+'@clare-scouting');
    out.push('DTSTAMP:'+icsDate(todayISO())+'T000000Z');
    var from=icsTime(ev.startTime), last=ev.end||ev.start;
    if(from){
      var to=icsTime(ev.endTime);
      if(!to || (last===ev.start && to<=from)) to=icsHourAfter(from);
      out.push('DTSTART;TZID=Europe/Dublin:'+icsAt(ev.start, from));
      out.push('DTEND;TZID=Europe/Dublin:'+icsAt(last, to));
    } else {
      out.push('DTSTART;VALUE=DATE:'+icsDate(ev.start));
      out.push('DTEND;VALUE=DATE:'+icsDate(last, 1));
    }
    out.push('SUMMARY:'+icsEscape(ev.name));
    if(ev.location) out.push('LOCATION:'+icsEscape(ev.location));
    if(ev.link) out.push('URL:'+icsEscape(ev.link));
    out.push('DESCRIPTION:'+icsEscape(desc.join('\n')));
    /* Free, not busy. These are all-day markers on a reference calendar, and an
       event that defaults to OPAQUE makes the subscriber look unavailable all
       day to everyone who checks their free/busy. Downloaded events are real
       editable entries, so anyone actually going can set their own to Busy. */
    out.push('STATUS:CONFIRMED');
    out.push('CLASS:PUBLIC');
    out.push('TRANSP:TRANSPARENT');
    if(!from) out.push('X-MICROSOFT-CDO-ALLDAYEVENT:TRUE');
    out.push('X-MICROSOFT-CDO-BUSYSTATUS:FREE');
    out.push('X-MICROSOFT-CDO-INTENDEDSTATUS:FREE');
    out.push('END:VEVENT');
  });
  out.push('END:VCALENDAR');
  return out.map(fold).join('\r\n');
}
// RFC 5545 line folding: no content line longer than 75 octets.
function fold(line){
  if(line.length<=74) return line;
  var parts=[line.slice(0,74)], rest=line.slice(74);
  while(rest.length>73){ parts.push(' '+rest.slice(0,73)); rest=rest.slice(73); }
  if(rest.length) parts.push(' '+rest);
  return parts.join('\r\n');
}
function downloadBlob(name, blob){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },200);
}
function download(name, text, mime){
  var blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },200);
}

/* ---------------------------------------------------------------- admin */
var admin = { pin:'', as:null, role:null, section:null, draft:null, editingId:null, downloaded:false };

// A section PIN owns only events that are for that section alone. Joint and
// county-wide events stay with the county PIN. The function enforces this too.
function canEdit(ev){
  if(admin.role === 'admin') return true;
  if(admin.role !== 'section') return false;
  var s = secsOf(ev);
  return s.length === 1 && s[0] === admin.section;
}
function roleLabel(){
  if(admin.role === 'admin') return 'County';
  var sec = SEC_BY_ID[admin.section];
  return sec ? sec.name : 'Section';
}

function openAdmin(){
  var saved = null, savedAs = null;
  try{
    saved = sessionStorage.getItem('ccs_pin');
    savedAs = sessionStorage.getItem('ccs_as');
  }catch(e){}
  open$('adScrim');
  if(saved){
    adminBusy('Checking your PIN…');
    authenticate(saved, savedAs, function(ok){ if(!ok) adminPinScreen(); });
  } else {
    adminPinScreen();
  }
}

function adminBusy(msg){
  $('adTitle').textContent='Admin';
  $('adBody').innerHTML='';
  $('adBody').appendChild(el('p','note', msg));
}

function authenticate(pin, as, done){
  fetch(API+'?action=auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin:pin, as:as||''})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ok){
        admin.pin = pin; admin.role = d.role; admin.section = d.section || null;
        admin.as = d.role === 'admin' ? 'admin' : d.section;
        try{
          sessionStorage.setItem('ccs_pin', pin);
          sessionStorage.setItem('ccs_as', admin.as);
        }catch(e){}
        adminPanel();
        done && done(true);
      } else {
        try{ sessionStorage.removeItem('ccs_pin'); sessionStorage.removeItem('ccs_as'); }catch(e){}
        done && done(false);
      }
    })
    .catch(function(){
      adminPinScreen('Could not reach the events service. See the README.');
      done && done(true);
    });
}

var LOGIN_ROLES = [{id:'admin', name:'County', note:'full access, all sections'}].concat(
  SECTIONS.map(function(x){ return {id:x.id, name:x.name, note:x.name + ' events only', colour:x.colour}; }));

function roleById(id){
  for(var i=0;i<LOGIN_ROLES.length;i++) if(LOGIN_ROLES[i].id===id) return LOGIN_ROLES[i];
  return null;
}

// Step one: say who you are. Picking first means a mistyped digit is refused
// rather than quietly signing you in to somebody else's section.
function adminPinScreen(msg){
  $('adTitle').textContent='Admin \u00b7 Sign in';
  var b=$('adBody'); b.innerHTML='';
  b.appendChild(el('p','note','Choose which section you are administering.'));

  var grid=el('div','rolegrid');

// Step two: the PIN, checked against the role that was chosen.
function adminPinEntry(as, msg){
  var role = roleById(as);
  if(!role){ adminPinScreen(); return; }

  $('adTitle').textContent='Admin \u00b7 '+role.name;
  var b=$('adBody'); b.innerHTML='';

  var who=el('div','whorow');
  var sw=el('span','roleswatch'); sw.style.background = role.colour || 'var(--deep)';
  who.appendChild(sw);
  who.appendChild(el('span','whoname','Signing in as '+role.name));
  var chg=el('button','linkbtn','Change');
  chg.onclick=function(){ adminPinScreen(); };
  who.appendChild(chg);
  b.appendChild(who);

  var row=el('div','pinbox');
  var inp=el('input'); inp.type='password'; inp.inputMode='numeric'; inp.autocomplete='off'; inp.placeholder='\u2022\u2022\u2022\u2022';
  var go=el('button','btn','Unlock');
  row.appendChild(inp); row.appendChild(go);
  b.appendChild(row);
  if(msg) b.appendChild(el('div','err',msg));

  var busy=false;
  function submit(){
    if(busy) return;
    if(!inp.value){ adminPinEntry(as, 'Enter the PIN.'); return; }
    busy=true; go.disabled=true; go.textContent='Checking\u2026';
    authenticate(inp.value, as, function(ok){
      if(!ok){ busy=false; adminPinEntry(as, 'That PIN is not right for '+role.name+'. Check you picked the right section.'); }
    });
  }
  go.onclick=submit;
  inp.onkeydown=function(e){ if(e.key==='Enter') submit(); };
  setTimeout(function(){ inp.focus(); }, 60);
}

function signOut(backToPicker){

}

// Switching user throws away an unpublished draft, so say so first.
function confirmSwitch(backToPicker){

  $('adTitle').textContent='Admin \u00b7 Unpublished changes';

    (backToPicker ? 'Switching user' : 'Logging out') + ' now discards them. Publish first if you want to keep them.'));
  b.appendChild(box);
  var foot=el('div','ctl-row'); foot.style.marginTop='12px';
  var back=el('button','btn','Back to my changes');
  back.onclick=function(){ adminPanel(); };
  var go=el('button','btn danger', backToPicker ? 'Discard and switch' : 'Discard and log out');

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function saveDraft(){ try{ localStorage.setItem('ccs_draft', JSON.stringify(admin.draft)); }catch(e){} }
function readDraft(){
  try{
    var d=JSON.parse(localStorage.getItem('ccs_draft'));
    return Array.isArray(d) ? d.map(normalise) : null;
  }catch(e){ return null; }
}
function clearDraft(){ try{ localStorage.removeItem('ccs_draft'); }catch(e){} }
function sig(list){ return JSON.stringify(list.slice().sort(sortByDate)); }
function draftDirty(){
  var mine = function(l){ return l.filter(canEdit); };
  return sig(mine(admin.draft)) !== sig(mine(state.events));
}

function adminPanel(){
  if(!admin.draft){
    var kept = readDraft();
    admin.draft = kept || state.events.map(clone);
  }
  var isRoot = admin.role === 'admin';
  $('adTitle').textContent = 'Admin · ' + roleLabel();
  var b=$('adBody'); b.innerHTML='';

  if(!isRoot){
    var scope = el('p','scopenote');

    scope.appendChild(document.createTextNode(
      ' You can add, edit and delete ' + roleLabel() + ' events. Joint and county-wide events are shown greyed out and can only be changed with the county PIN.'));
    b.appendChild(scope);
  }

  var bar=el('div','ctl-row'); bar.style.marginBottom='12px';
  var addBtn=el('button','btn','+ New event');
  addBtn.onclick=function(){ eventForm(null); };
  var sp=el('span','spacer');
  var exp=el('button','btn sec','Export to Excel');
  exp.onclick=function(){
    var list = isRoot ? admin.draft : admin.draft.filter(canEdit);
    var name = 'clare-scout-county-events' + (isRoot ? '' : '-' + admin.section) + '.xlsx';

  var imp=el('input'); imp.type='file'; imp.accept='.xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv'; imp.style.display='none';
  imp.onchange=function(){

  impLbl.appendChild(imp);
  var histBtn=el('button','btn sec','History');
  histBtn.title='Who changed what, and put the calendar back if needed';
  histBtn.onclick=function(){ historyPanel(); };
  var switchBtn=el('button','btn sec','Switch user');
  switchBtn.onclick=function(){ confirmSwitch(true); };
  var lock=el('button','btn sec','Log out');
  lock.onclick=function(){ confirmSwitch(false); };
  var pinBtn=el('button','btn sec','PINs');
  pinBtn.onclick=function(){ pinPanel(); };
  var guideBtn=el('button','btn sec','Section guides');

  bar.appendChild(addBtn); bar.appendChild(sp); bar.appendChild(exp); bar.appendChild(impLbl);
  bar.appendChild(histBtn);
  if(isRoot){ bar.appendChild(pinBtn); bar.appendChild(guideBtn); }
  bar.appendChild(switchBtn); bar.appendChild(lock);
  b.appendChild(bar);

  var list=el('div','adminlist');
  if(!admin.draft.length){
    list.appendChild(el('div','arow','No events yet. Add the first one.'));
  } else {
    admin.draft.slice().sort(sortByDate).forEach(function(ev){
      var mine = canEdit(ev);
      var r=el('div','arow'+(mine?'':' locked'));
      r.appendChild(el('span','when', fmtRangeShort(ev)+' '+String(parseISO(ev.start).getFullYear()).slice(2)));
      var sw=el('span','secmini');
      sw.style.background = sectionPaint(secsOf(ev));
      sw.title = sectionLabel(ev);
      r.appendChild(sw);
      r.appendChild(el('span','nm', ev.name));
      if(mine){
        var ed=el('button',null,'Edit'); ed.onclick=function(){ eventForm(ev.id); };
        var cp=el('button',null,'Copy'); cp.title='Make another event like this one';
        cp.onclick=function(){ duplicateEvent(ev.id); };
        var rm=el('button',null,'Delete'); rm.onclick=function(){
          admin.draft=admin.draft.filter(function(x){ return x.id!==ev.id; }); adminPanel();
        };
        r.appendChild(ed); r.appendChild(cp); r.appendChild(rm);
      } else {
        r.appendChild(el('span','lockchip','County'));
      }
      list.appendChild(r);
    });
  }
  b.appendChild(list);

  var dirty = draftDirty();

  var foot=el('div','ctl-row'); foot.style.marginTop='14px';
  var save=el('button','btn','Publish to the calendar');
  var status=el('span','note','');
  save.disabled = !dirty;
  save.onclick=function(){
    save.disabled=true; save.textContent='Publishing…'; status.className='note'; status.textContent='';
    fetch(API,{
      method:'PUT',
      headers:{'content-type':'application/json','x-admin-pin':admin.pin,'x-admin-as':admin.as||''},
      body:JSON.stringify({events:admin.draft})
    })
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        save.textContent='Publish to the calendar';
        if(!res.ok){
          save.disabled=false;

  } else {
    var n = admin.draft.length;
    steps.appendChild(el('p','steps-head',
      'Unpublished changes to ' + roleLabel() + ' events. The calendar still shows ' +
      state.events.length + ' event' + (state.events.length===1?'':'s') + ', this draft has ' + n + '.'));
    steps.appendChild(el('p','note','Press Publish and everyone sees them straight away. Your draft is kept in this browser until you do, so you can close this and come back.'));
  }
  b.appendChild(steps);

  saveDraft();
}

function importSpreadsheet(file){
  var isXlsx = /\.xlsx$/i.test(file.name);
  $('adTitle').textContent='Admin \u00b7 Reading ' + file.name;
  $('adBody').innerHTML='';
  $('adBody').appendChild(el('p','note','Reading the spreadsheet\u2026'));

  var reader = new FileReader();
  reader.onload = function(){
    var work = isXlsx ? parseXlsx(reader.result) : Promise.resolve(parseCsv(reader.result));
    work.then(function(rows){
      importReview(rowsToEvents(rows), file.name);
    }).catch(function(err){
      var msg = (err && err.message === 'nodeflate')
        ? 'This browser cannot open .xlsx files. Save the sheet as CSV in Excel and import that instead.'
        : 'Could not read that file. Make sure it is a .xlsx or .csv saved from a spreadsheet.';
      importError(msg);
    });
  };
  reader.onerror = function(){ importError('Could not read that file.'); };
  if(isXlsx) reader.readAsArrayBuffer(file); else reader.readAsText(file);
}

// Nothing is changed until this is confirmed, and a section PIN only ever
// sees the rows it would actually be allowed to publish.
function importReview(result, filename){
  var isRoot = admin.role === 'admin';
  var usable = isRoot ? result.events : result.events.filter(canEdit);
  var skipped = result.events.length - usable.length;

  $('adTitle').textContent='Admin \u00b7 Import';
  var b=$('adBody'); b.innerHTML='';
  b.appendChild(el('p','note', filename));

  if(!usable.length){
    b.appendChild(el('div','err', result.events.length
      ? 'None of the ' + result.events.length + ' rows are ' + roleLabel() + ' events, so there is nothing you can import.'
      : 'No usable rows found.'));
  } else {
    var box=el('div','steps');
    box.appendChild(el('p','steps-head', 'Found ' + usable.length + ' event' + (usable.length===1?'':'s') + '.'));
    var note = 'This replaces the ' + (isRoot ? 'whole list' : roleLabel() + ' events') + ' in your draft. Nothing goes live until you press Publish.';
    if(skipped) note = skipped + ' row' + (skipped===1?' was':'s were') + ' for other sections and ' + (skipped===1?'was':'were') + ' left out. ' + note;
    box.appendChild(el('p','note', note));

    b.appendChild(prev);
  }

  if(result.errors.length){
    var warn=el('div','importwarn');
    warn.appendChild(el('p','steps-head', result.errors.length + ' row' + (result.errors.length===1?'':'s') + ' need a look:'));
    var ul=el('ul');
    result.errors.slice(0,10).forEach(function(e){ ul.appendChild(el('li',null,e)); });
    if(result.errors.length>10) ul.appendChild(el('li',null,'\u2026 and ' + (result.errors.length-10) + ' more'));
    warn.appendChild(ul);
    b.appendChild(warn);
  }

  var foot=el('div','ctl-row'); foot.style.marginTop='12px';
  if(usable.length){
    var ok=el('button','btn','Use these ' + usable.length + ' event' + (usable.length===1?'':'s'));
    ok.onclick=function(){
      if(isRoot){
        admin.draft = usable;

      }
      adminPanel();
      toast('Imported. Press Publish to make it live.');
    };
    foot.appendChild(ok);
  }
  var cancel=el('button','btn sec','Cancel');
  cancel.onclick=function(){ adminPanel(); };
  foot.appendChild(cancel);
  b.appendChild(foot);

function fmtWhen(isoStamp){
  var d = new Date(isoStamp);
  return d.toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'}) +
         ', ' + d.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'});
}
function changeSummary(h){
  var bits = [];
  if(h.counts.added)   bits.push(h.counts.added + ' added');
  if(h.counts.changed) bits.push(h.counts.changed + ' changed');
  if(h.counts.removed) bits.push(h.counts.removed + ' removed');
  return bits.length ? bits.join(', ') : 'no change';
}

/* Every publish snapshots the calendar as it then stood, so this doubles as
   the record of who changed what and the way back from a bad one. */
function historyPanel(msg){
  var isRoot = admin.role === 'admin';
  $('adTitle').textContent='Admin \u00b7 History';
  var b=$('adBody'); b.innerHTML='';
  b.appendChild(el('p','note','Every publish is recorded, with what changed and who did it. The last 20 are kept.'));
  var loading=el('p','note','Loading\u2026'); b.appendChild(loading);

  fetch(API+'?action=history',{headers:{'x-admin-pin':admin.pin}})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(res){
      b.innerHTML='';
      b.appendChild(el('p','note','Every publish is recorded, with what changed and who did it. The last 20 are kept.'));
      if(!res.ok){ b.appendChild(el('div','err',(res.d && res.d.error)||'Could not load the history')); return; }
      var list = res.d.history || [];
      if(msg) b.appendChild(el('div','ok', msg));

      if(!list.length){
        b.appendChild(el('p','note','Nothing recorded yet. The next publish will appear here.'));
      } else {
        var wrap=el('div','histlist');
        list.forEach(function(h, i){
          var row=el('div','histrow');
          var head=el('div','histhead');
          head.appendChild(el('span','histwho', h.by));
          head.appendChild(el('span','histwhen', fmtWhen(h.at)));
          if(i===0) head.appendChild(el('span','histnow','current'));
          row.appendChild(head);

          row.appendChild(el('div','histsum', changeSummary(h) + '  \u00b7  ' + h.total + ' event' + (h.total===1?'':'s') + ' after'));

          var detail=[];
          if(h.added.length)   detail.push('Added: ' + h.added.join(', '));
          if(h.removed.length) detail.push('Removed: ' + h.removed.join(', '));
          if(h.changed.length) detail.push('Changed: ' + h.changed.join(', '));
          if(h.note) detail.push(h.note);
          if(detail.length) row.appendChild(el('div','histdetail', detail.join('  \u00b7  ')));

          if(isRoot && i > 0){
            var rb=el('button','histbtn','Restore this');
            rb.onclick=function(){ confirmRestore(h); };
            row.appendChild(rb);
          }
          wrap.appendChild(row);
        });
        b.appendChild(wrap);
      }

      if(!isRoot){
        b.appendChild(el('p','note','Restoring a previous version needs the county PIN.'));
      }
      var foot=el('div','ctl-row'); foot.style.marginTop='12px';
      var back=el('button','btn sec','Back to events');
      back.onclick=function(){ adminPanel(); };
      foot.appendChild(back);
      b.appendChild(foot);
    })
    .catch(function(){
      b.innerHTML='';
      b.appendChild(el('div','err','Could not reach the events service.'));
    });
}

  $('adTitle').textContent='Admin \u00b7 Restore';

  var box=el('div','steps');
  box.appendChild(el('p','steps-head','Put the calendar back to how it was on ' + fmtWhen(h.at) + '?'));
  box.appendChild(el('p','note','That version had ' + h.total + ' event' + (h.total===1?'':'s') +
    '. Everything published since then is replaced. The restore is itself recorded, so you can undo it the same way.'));

  var foot=el('div','ctl-row'); foot.style.marginTop='12px';
  var go=el('button','btn danger','Restore that version');
  go.onclick=function(){
    go.disabled=true; go.textContent='Restoring\u2026';
    fetch(API+'?action=history',{method:'PUT',
      headers:{'content-type':'application/json','x-admin-pin':admin.pin},
      body:JSON.stringify({id:h.id})})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
      .then(function(res){
        if(!res.ok){ go.disabled=false; go.textContent='Restore that version';
          b.appendChild(el('div','err',(res.d && res.d.error)||'Could not restore')); return; }
        state.events = (res.d.events||[]).map(normalise);
        state.updatedAt = res.d.updatedAt;
        admin.draft = state.events.map(clone);
        clearDraft(); render();
        historyPanel('Restored. The calendar is back to how it was on ' + fmtWhen(h.at) + '.');

      })
      .catch(function(){
        go.disabled=false; go.textContent='Restore that version';
        b.appendChild(el('div','err','Could not reach the events service.'));
      });
  };

  cancel.onclick=function(){ historyPanel(); };

}

    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })

      b.innerHTML='';

      if(!res.ok){ b.appendChild(el('div','err',(res.d && res.d.error)||'Could not load the PINs')); return; }

      var pins = res.d.pins || {};

      var rows = [{id:'admin', name:'County (full access)', colour:'var(--deep)'}].concat(

      var wrap=el('div','pinlist');

        var r=el('div','pinrow');

        var i=el('input'); i.type='text'; i.inputMode='numeric'; i.autocomplete='off';

        i.oninput=function(){ i.value = i.value.replace(/\D/g,'').slice(0,8); };

        wrap.appendChild(r);
      });
      b.appendChild(wrap);

      var err=el('div','err', msg||''); b.appendChild(err);
      if(saved) b.appendChild(el('div','ok','PINs saved.'));

      var foot=el('div','ctl-row'); foot.style.marginTop='12px';
      var save=el('button','btn','Save PINs');
      save.onclick=function(){
        var next={}, seen={};
        for(var k in inputs){
          var v=inputs[k].value.trim();
          if(!/^\d{4,8}$/.test(v)){ err.textContent='Every PIN must be 4 to 8 digits.'; return; }
          if(seen[v]){ err.textContent='Every PIN must be different.'; return; }

        }
        err.textContent='';
        save.disabled=true; save.textContent='Saving…';
        fetch(API+'?action=pins',{method:'PUT',headers:{'content-type':'application/json','x-admin-pin':admin.pin},body:JSON.stringify({pins:next})})
          .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })

    .catch(function(){

      b.appendChild(el('div','err','Could not reach the events service.'));
    });
}

function normalise(raw){
  return {
    id: raw.id || ('ev_'+Math.random().toString(36).slice(2,10)),
    name: raw.name||'', start: raw.start||todayISO(), end: raw.end||'',
    time: raw.time||'',
    category: ['training','county','national'].indexOf(raw.category)>-1 ? raw.category : 'county',
    sections: Array.isArray(raw.sections)&&raw.sections.length ? raw.sections.filter(function(s){return SEC_BY_ID[s];}) : ALL_SECTION_IDS.slice(),
    description: raw.description||'', host: raw.host||'', location: raw.location||'',
    link: raw.link||'',
    contactName: raw.contactName||'', contactEmail: raw.contactEmail||'', contactPhone: raw.contactPhone||''
  };
}

// Anything else for the same section overlapping these dates. Advisory only:
// double-booking is sometimes deliberate, so it warns rather than blocks.
function findClashes(draftEvent, ignoreId){
  var secs = secsOf(draftEvent);
  var aStart = draftEvent.start, aEnd = draftEvent.end || draftEvent.start;
  return (admin.draft || []).filter(function(ev){
    if(ev.id === ignoreId) return false;
    var bStart = ev.start, bEnd = ev.end || ev.start;
    if(aStart > bEnd || aEnd < bStart) return false;
    return secsOf(ev).some(function(x){ return secs.indexOf(x) > -1; });
  });
}

function duplicateEvent(id){
  var src = admin.draft.filter(function(x){ return x.id===id; })[0];
  if(!src) return;
  var copy = clone(src);
  copy.id = 'ev_' + Math.random().toString(36).slice(2,10);
  copy.name = src.name + ' (copy)';
  admin.draft = admin.draft.concat([copy]);
  adminPanel();
  eventForm(copy.id);
  toast('Copied. Change the date and name, then Publish.');
}

function eventForm(id){
  var ev = id ? admin.draft.filter(function(x){return x.id===id;})[0] : null;
  var m = ev ? JSON.parse(JSON.stringify(ev)) : normalise({});
  $('adTitle').textContent = id ? 'Edit event' : 'New event';
  var b=$('adBody'); b.innerHTML='';

  function field(label, node){
    var f=el('div','field'); f.appendChild(el('label',null,label)); f.appendChild(node); return f;
  }
  function text(val, ph, type){
    var i=el('input'); i.type=type||'text'; i.value=val||''; if(ph) i.placeholder=ph; return i;
  }

  var fName=text(m.name,'e.g. County Cub Adventure Day');
  var fStart=text(m.start,'',"date");
  var fEnd=text(m.end,'',"date");
  var fTime=text(m.time,'e.g. 10:00 – 16:00');
  var fLoc=text(m.location,'e.g. Lees Road, Ennis');
  var fLink=text(m.link,'e.g. a booking form or kit list');
  var fHost=text(m.host,'e.g. Clare County Team / 1st Ennis');
  var fCName=text(m.contactName,'e.g. Craig Hill');
  var fCEmail=text(m.contactEmail,'name@example.ie','email');
  var fCPhone=text(m.contactPhone,'087 …','tel');
  var fDesc=el('textarea'); fDesc.value=m.description||''; fDesc.placeholder='What it is, what to bring, booking details…';

  var catSel=el('select');
  CATEGORIES.forEach(function(c){
    var o=el('option',null,c.name); o.value=c.id; if(m.category===c.id) o.selected=true; catSel.appendChild(o);
  });

  var checksWrap=el('div','checks');
  var boxes={};
  var lockSections = admin.role === 'section';
  if(lockSections && !id){ m.sections = [admin.section]; }
  var allLab=el('label','check');
  var allBox=el('input'); allBox.type='checkbox';
  allBox.checked = m.sections.length===SECTIONS.length;
  allLab.appendChild(allBox); allLab.appendChild(document.createTextNode('All Sections'));
  allBox.onchange=function(){
    SECTIONS.forEach(function(s){ boxes[s.id].checked=allBox.checked; boxes[s.id].parentNode.classList.toggle('on', allBox.checked); });
    allLab.classList.toggle('on', allBox.checked);
  };
  allLab.classList.toggle('on', allBox.checked);
  if(!lockSections) checksWrap.appendChild(allLab);
  SECTIONS.forEach(function(s){
    var lab=el('label','check');
    var cb=el('input'); cb.type='checkbox'; cb.checked = m.sections.indexOf(s.id)>-1;
    if(lockSections){
      cb.checked = (s.id === admin.section);
      cb.disabled = true;
      lab.classList.add('fixed');
      if(s.id !== admin.section) lab.style.display='none';
    }
    lab.classList.toggle('on', cb.checked);
    var d=el('span','secdot'); d.style.background=s.colour;
    lab.appendChild(cb); lab.appendChild(d); lab.appendChild(document.createTextNode(s.name));
    cb.onchange=function(){
      lab.classList.toggle('on', cb.checked);
      var all=SECTIONS.every(function(x){ return boxes[x.id].checked; });
      allBox.checked=all; allLab.classList.toggle('on', all);
      if(typeof checkClash === 'function') checkClash();
    };
    boxes[s.id]=cb; checksWrap.appendChild(lab);
  });

  b.appendChild(field('Event name *', fName));
  var row1=el('div','two');
  row1.appendChild(field('Start date *', fStart));
  row1.appendChild(field('End date (same as the start for one day)', fEnd));
  b.appendChild(row1);
  var row2=el('div','two');
  row2.appendChild(field('Type', catSel));
  row2.appendChild(field('Time (optional)', fTime));
  b.appendChild(row2);
  var secField = field('Sections', checksWrap);
  if(lockSections){
    secField.appendChild(el('p','note','Fixed to ' + roleLabel() + '. Joint and county-wide events need the county PIN.'));
  }
  b.appendChild(secField);
  b.appendChild(field('Location / venue', fLoc));
  b.appendChild(field('Link (booking form, kit list, anything online)', fLink));
  b.appendChild(field('Description', fDesc));
  b.appendChild(field('Hosted by', fHost));
  var row3=el('div','three');
  row3.appendChild(field('Contact name', fCName));
  row3.appendChild(field('Contact email', fCEmail));
  row3.appendChild(field('Contact phone', fCPhone));
  b.appendChild(row3);

  var err=el('div','err','');
  b.appendChild(err);

  var clash=el('div','clashwarn');
  b.appendChild(clash);
  function checkClash(){
    var secs = lockSections ? [admin.section]
             : SECTIONS.filter(function(x){ return boxes[x.id].checked; }).map(function(x){ return x.id; });
    if(!fStart.value || !secs.length){ clash.className='clashwarn'; clash.textContent=''; return; }
    var hits = findClashes({start:fStart.value, end:fEnd.value||'', sections:secs}, id);
    if(!hits.length){ clash.className='clashwarn'; clash.textContent=''; return; }
    clash.className='clashwarn on';
    clash.innerHTML = '';
    clash.appendChild(el('b', null, 'Already something on:'));
    var ul=el('ul');
    hits.slice(0,4).forEach(function(ev){
      ul.appendChild(el('li', null, ev.name + '  \u00b7  ' + fmtRangeShort(ev) + '  \u00b7  ' + sectionLabel(ev)));
    });
    if(hits.length>4) ul.appendChild(el('li', null, '\u2026 and ' + (hits.length-4) + ' more'));
    clash.appendChild(ul);
    clash.appendChild(el('span','note','That may well be fine. This is only a heads-up.'));
  }
  /* The end date follows the start until it is deliberately moved past it.
     A native date picker opens on whatever the field already holds, so an empty
     end field meant scrolling from today to next May every time an event was
     added. Mirroring the start opens it in the right month, one tap from done.
     min stops the picker offering dates before the start at all. */
  var lastStart = fStart.value;
  function syncEnd(){
    fEnd.min = fStart.value || '';
    if(!fStart.value) return;
    if(!fEnd.value || fEnd.value === lastStart || fEnd.value < fStart.value){
      fEnd.value = fStart.value;
    }
    lastStart = fStart.value;
  }
  syncEnd();

  fStart.addEventListener('input',  syncEnd);
  fStart.addEventListener('change', function(){ syncEnd(); checkClash(); });
  fEnd.addEventListener('change', checkClash);
  setTimeout(checkClash, 0);

  var foot=el('div','ctl-row'); foot.style.marginTop='6px';
  var ok=el('button','btn', id ? 'Update event' : 'Add event');
  ok.onclick=function(){
    var name=fName.value.trim();
    if(!name){ err.textContent='Give the event a name.'; return; }
    if(!fStart.value){ err.textContent='Pick a start date.'; return; }
    if(fEnd.value && fEnd.value < fStart.value){ err.textContent='The end date is before the start date.'; return; }
    var secs=SECTIONS.filter(function(s){ return boxes[s.id].checked; }).map(function(s){ return s.id; });
    if(!secs.length){ err.textContent='Choose at least one section.'; return; }
    var out={
      /* A one-day event is still stored with a blank end, exactly as before,
         so nothing downstream sees a change from the mirroring above. */
      id: m.id, name:name, start:fStart.value,
      end: (fEnd.value && fEnd.value !== fStart.value) ? fEnd.value : '',
      time:fTime.value.trim(), category:catSel.value, sections:secs,
      description:fDesc.value.trim(), host:fHost.value.trim(), location:fLoc.value.trim(),
      link:fLink.value.trim(),
      contactName:fCName.value.trim(), contactEmail:fCEmail.value.trim(), contactPhone:fCPhone.value.trim()
    };
    out = normalise(out);
    if(id){ admin.draft = admin.draft.map(function(x){ return x.id===id ? out : x; }); }
    else { admin.draft = admin.draft.concat([out]); }
    adminPanel();
  };
  var cancel=el('button','btn sec','Cancel');
  cancel.onclick=function(){ adminPanel(); };
  foot.appendChild(ok); foot.appendChild(cancel);
  b.appendChild(foot);
  setTimeout(function(){ fName.focus(); },60);
}

// If this month has nothing on, open on the next month that does.
function jumpToFirstUpcoming(){
  var cur=state.cursor, t=todayISO();
  var thisMonth = state.events.some(function(ev){
    return daysBetween(ev.start, ev.end).some(function(d){
      var p=parseISO(d); return p.getMonth()===cur.getMonth() && p.getFullYear()===cur.getFullYear();
    });
  });
  if(thisMonth) return;
  var next = state.events.filter(function(ev){ return (ev.end||ev.start) >= t; }).sort(sortByDate)[0];
  if(next) state.cursor = startOfMonth(parseISO(next.start));
}

/* The app stores an event as {date,endDate,title,section,location,time,details,
   kitId,countyId}. The calendar below was written for the county's shape, so
   one adapter here lets every renderer, the poster and the ics work untouched. */
function fromContent(e, i){
  return {
    id: e.countyId || ('ev' + i),
    name: e.title || '',
    start: e.date,
    end: e.endDate || e.date,
    time: eventWhen(e),
    startTime: e.startTime || '',
    endTime: e.endTime || '',
    category: e.countyId ? 'county' : 'group',
    sections: e.section ? [e.section] : ALL_SECTION_IDS.slice(),
    description: e.details || '',
    host: '',
    location: e.location || '',
    link: '',
    kitId: e.kitId || '',
    contactName:'', contactEmail:'', contactPhone:''
  };
}

function load(){
  fetch(API, {cache:'no-store'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(d){
      state.stale = d.offlineCopy === true;
      state.events = (d.events||[]).map(fromContent).map(normalise);
      state.updatedAt = d.updatedAt || null;
      $('offlineBar').classList.toggle('on', !!state.stale);
      jumpToFirstUpcoming();
      render();
      maybePrintView();     // only does anything for the ?print=1 link
    })
    .catch(function(){
      state.events=[]; state.apiDown=true; render();
    });
}

buildControls();
render();
load();

})();
</script>

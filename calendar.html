/* Palette taken straight off the county badge:
   sky #00B9F0 · deep blue #1F409B · sun #FFF100 · grass #8DC345 · dolmen #51432C · stone #B5A8A3.
   That is the county calendar this was ported from. Every one of these is
   overridden by the Burren palette at the end of this stylesheet; they stay
   so the ported rules in between still have something to resolve against. */
:root{
  --sky:#00B9F0; --deep:#1F409B; --sun:#FFF100; --grass:#8DC345; --dolmen:#51432C; --stone:#B5A8A3;
  --bg:#F1F8FC; --surface:#FFFFFF; --surface-2:#E9F4FA; --line:#CDE2EE; --line-soft:#E3EFF6;
  --text:#17263A; --text-soft:#4E6275; --text-faint:#7C8FA0;
  --shadow:0 1px 2px rgba(23,38,58,.06), 0 8px 24px -12px rgba(23,38,58,.22);
  --r:12px;
  --training:#0B7396; --training-tint:#E0F5FD; --training-edge:#00B9F0;
  --county:#8A6400;   --county-tint:#FEF7C9;   --county-edge:#EFC600;
  --national:#4E7A16; --national-tint:#EDF7DE; --national-edge:#8DC345;
  --sec-beavers:#00A9D6; --sec-cubs:#3C9A52; --sec-scouts:#1F409B;
  --sec-ventures:#8E2B3F; --sec-rovers:#C0392B; --sec-scouters:#6B5CA5;
  --on-accent:#FFFFFF; --accent:var(--deep); --tint:22%; --chip-tint:26%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1725; --surface:#152134; --surface-2:#1C2B41; --line:#2C3E58; --line-soft:#223349;
    --text:#E9F1F7; --text-soft:#A9BCCC; --text-faint:#7A8DA0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px -14px rgba(0,0,0,.75);
    --training:#63D2F7; --training-tint:#0C2C3A; --training-edge:#00B9F0;
    --county:#F5D65A;  --county-tint:#332B08;  --county-edge:#EFC600;
    --national:#A9DC6C; --national-tint:#1C2C12; --national-edge:#8DC345;
    --sec-beavers:#4FCBEC; --sec-cubs:#59BE72; --sec-scouts:#6E9FD4;
    --sec-ventures:#D2687C; --sec-rovers:#E0705F; --sec-scouters:#A192DC;
    --on-accent:#0D1725; --accent:var(--sky); --tint:34%; --chip-tint:38%;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Archivo","Archivo Black",Helvetica,Arial,sans-serif;font-weight:700;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--training)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* ---------- shell ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px;
      padding-left:max(16px, env(safe-area-inset-left));
      padding-right:max(16px, env(safe-area-inset-right))}
.offline{display:none;align-items:center;gap:8px;margin:10px 0 0;padding:9px 13px;border-radius:9px;
         background:var(--county-tint);border:1px solid var(--county-edge);color:var(--county);font-size:13px}
.offline.on{display:flex}
.offline b{font-weight:700}
.installrow{margin-top:10px}
.substep{padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--surface)}
.substep h4{margin:0 0 4px;font-size:14.5px}
.substep .note{margin:0 0 9px}
.urlrow{display:flex;gap:8px;margin-bottom:8px}
.urlbox{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
        background:var(--bg);color:var(--text);font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.installsteps{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:var(--text-soft);line-height:1.55}
.installsteps li{margin-bottom:6px}
header.top{background:var(--deep);color:#fff;border-bottom:4px solid var(--sun);
           padding-top:env(safe-area-inset-top)}   /* under the iOS status bar */
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:16px;padding-bottom:16px}
.mark{width:60px;flex:0 0 60px;border-radius:7px;background:#fff;padding:3px;box-shadow:0 2px 6px rgba(0,0,0,.28);display:block}
.mark img{width:100%;height:auto;display:block;border-radius:4px}
.brand h1{margin:0;font-size:19px;line-height:1.12;color:#fff;text-transform:uppercase;letter-spacing:.02em;font-weight:800}
.brand p{margin:3px 0 0;font-size:12.5px;color:var(--sun);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.ghost-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600}
.ghost-btn:hover{background:rgba(255,255,255,.2);border-color:#fff}
.ghost-btn .ico{display:none;width:17px;height:17px;fill:currentColor}

/* ---------- controls ---------- */
.controls{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:18px 0}
.ctl-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.ctl-row + .ctl-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);margin-right:2px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface-2);color:var(--text-soft);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.pill:hover{border-color:var(--sky)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:var(--text-faint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg button{background:transparent;border:0;padding:7px 15px;cursor:pointer;color:var(--text-soft)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.spacer{flex:1 1 auto}
.icon-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;color:var(--text-soft)}
.icon-btn:hover{border-color:var(--sky);color:var(--text)}
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav h2{margin:0;font-size:20px;min-width:190px;text-align:center}

/* ---------- calendar ---------- */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface-2);border-bottom:1px solid var(--line)}
.dow div{padding:8px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);text-align:center}
.grid{display:block}
.week{position:relative}
.week + .week{border-top:1px solid var(--line-soft)}
.week-bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);pointer-events:none}
.week-bg span{border-right:1px solid var(--line-soft)}
.week-bg span:last-child{border-right:0}
.week-bg span.out{background:var(--surface-2);opacity:.5}
.week-grid{position:relative;display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;padding:6px 0 8px;min-height:112px;align-content:start}
.dnum{grid-row:1;font-size:12px;font-weight:700;color:var(--text-soft);width:22px;height:22px;display:grid;place-items:center;justify-self:start;margin:0 0 3px 5px}
.dnum.out{opacity:.55}
.dnum.today{background:var(--accent);color:var(--on-accent);border-radius:50%}
/* one bar per event per week, spanning the days it covers */
.bar{position:relative;display:flex;align-items:center;gap:6px;min-width:0;margin:0 3px;border:0;border-radius:5px;padding:4px 8px 4px 13px;
     font-size:11.5px;line-height:1.3;cursor:pointer;color:var(--text);text-align:left;overflow:hidden;background:var(--surface-2)}
.bar:hover{filter:brightness(.96);box-shadow:inset 0 0 0 1px var(--line)}
.bar .edge{position:absolute;left:0;top:0;bottom:0;width:6px}
.bar .btxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar .btxt em{font-style:normal;font-weight:400;color:var(--text-soft)}
.mev-name em, em.muted{font-style:normal;font-weight:400;color:var(--text-faint)}
/* squared-off edges show a camp carrying on into the next week */
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0;padding-left:8px}
.bar.cl .edge{display:none}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.moreb{background:none;border:0;font-size:11px;color:var(--text-faint);cursor:pointer;text-align:left;padding:1px 6px;margin:0 3px}
.moreb:hover{color:var(--text);text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:0 2px 2px;margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-soft);white-space:nowrap}
.legend i{width:16px;height:10px;border-radius:3px;font-style:normal;flex:0 0 16px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.secchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;margin:0 3px 3px 0;white-space:nowrap;color:var(--text)}
.secchip i{width:7px;height:7px;border-radius:50%;font-style:normal}

/* ---------- agenda / table ---------- */
.agenda{display:none}
.mgroup{margin-top:20px}
.mgroup h3{margin:0 0 8px;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint)}
.tbl{width:100%;table-layout:fixed;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top;overflow-wrap:anywhere}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .when{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.tbl .sub{color:var(--text-soft);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.training{color:var(--training);background:var(--training-tint)}
.tag.county{color:var(--county);background:var(--county-tint)}
.tag.national{color:var(--national);background:var(--national-tint)}
.secdots{display:inline-flex;gap:3px;flex-wrap:wrap;align-items:center}
.secdot{width:8px;height:8px;border-radius:50%}
.seclist{font-size:12px;color:var(--text-soft)}
.empty{text-align:center;padding:56px 20px;color:var(--text-faint);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;font-size:17px;color:var(--text-soft);margin-bottom:6px;font-family:"Archivo",Helvetica,Arial,sans-serif}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(21,25,30,.55);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
.scrim.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);width:100%;max-width:560px;margin:auto}
.modal.wide{max-width:900px}
.modal header{display:flex;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line-soft)}
.modal header h2{margin:0;font-size:21px;flex:1}
.modal .body{padding:18px 20px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border-radius:0 0 14px 14px}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--text-faint);padding:2px 4px}
.x:hover{color:var(--text)}
dl.detail{margin:0;display:grid;grid-template-columns:118px 1fr;gap:10px 14px}
dl.detail dt{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);padding-top:2px}
dl.detail dd{margin:0}
.desc{white-space:pre-wrap}
.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600}
.btn:hover{opacity:.9}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--line)}
.btn.sec:hover{border-color:var(--sky);opacity:1}
.btn.danger{background:transparent;color:#B3402F;border-color:#E4B7AF}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- admin ---------- */
.field{margin-bottom:13px}
.field > label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);margin-bottom:5px}
.field input[type=text],.field input[type=date],.field input[type=email],.field input[type=tel],.field textarea,.field select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}
.field textarea{min-height:88px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--sky);outline-offset:-1px;border-color:var(--sky)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.check{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:13px}
.check input{accent-color:var(--deep);margin:0}
.check.on{border-color:var(--text-soft);background:var(--surface);font-weight:600}
.adminlist{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.arow{display:flex;gap:10px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line-soft)}
.arow:last-child{border-bottom:0}
.arow .when{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--text-soft);white-space:nowrap;min-width:104px}
.arow .nm{flex:1;font-weight:600;font-size:13.5px}
.arow button{background:none;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--text-soft)}
.arow button:hover{border-color:var(--sky);color:var(--text)}
.note{font-size:12.5px;color:var(--text-faint)}
.scopenote{font-size:13px;color:var(--text-soft);background:var(--surface-2);border-left:4px solid var(--sun);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.scopenote strong{color:var(--text)}
.secmini{width:16px;height:16px;border-radius:4px;flex:0 0 16px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.arow.locked{opacity:.55}
.arow.locked .nm{font-weight:400}
.lockchip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.check.fixed{opacity:.85;cursor:default}
.histlist{border:1px solid var(--line);border-radius:10px;max-height:46vh;overflow:auto}
.histrow{padding:10px 13px;border-bottom:1px solid var(--line-soft);position:relative}
.histrow:last-child{border-bottom:0}
.histhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.histwho{font-weight:700;font-size:13.5px}
.histwhen{font-size:12.5px;color:var(--text-faint)}
.histnow{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--national);
         background:var(--national-tint);border-radius:999px;padding:2px 8px}
.histsum{font-size:12.5px;color:var(--text-soft);margin-top:2px}
.histdetail{font-size:12px;color:var(--text-faint);margin-top:3px}
.histbtn{position:absolute;right:12px;top:11px;background:var(--surface);border:1px solid var(--line);
         border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--text-soft)}
.histbtn:hover{border-color:var(--sky);color:var(--text)}
.clashwarn{display:none}
.clashwarn.on{display:block;margin:0 0 12px;padding:10px 13px;border:1px solid var(--county-edge);
              border-left:4px solid var(--county-edge);border-radius:9px;background:var(--county-tint);
              color:var(--county);font-size:13px}
.clashwarn b{display:block;margin-bottom:4px}
.clashwarn ul{margin:0;padding-left:18px}
.clashwarn li{margin-bottom:2px}
.clashwarn .note{display:block;margin-top:5px}
.importwarn{margin-top:12px;padding:11px 14px;border:1px solid var(--line);border-left:4px solid var(--county-edge);
            border-radius:9px;background:var(--surface-2);font-size:12.5px;color:var(--text-soft)}
.importwarn ul{margin:6px 0 0;padding-left:18px}
.importwarn li{margin-bottom:3px}
.pinlist{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pinrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.pinrow:last-child{border-bottom:0}
.pinname{flex:1;font-weight:600;font-size:13.5px}
.pininput{width:110px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);
          font-variant-numeric:tabular-nums;letter-spacing:.14em;text-align:center}
.pininput:focus{outline:2px solid var(--sky);outline-offset:-1px}
.steps{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--sun);border-radius:10px;background:var(--surface-2)}
.steps-head{margin:0 0 8px;font-weight:700;color:var(--text)}
.steps ol{margin:0;padding-left:20px}
.steps li{margin-bottom:5px;color:var(--text-soft)}
.steps li.done{color:var(--text-faint);text-decoration:line-through}
.steps .note{margin:9px 0 0}
.err{color:#B3402F;font-size:13px;margin-top:8px}
.ok{color:var(--national);font-size:13px}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.rolebtn{display:flex;align-items:center;gap:11px;text-align:left;border:1px solid var(--line);background:var(--surface);
         border-radius:10px;padding:11px 13px;cursor:pointer;color:var(--text);font:inherit}
.rolebtn:hover{border-color:var(--sky);background:var(--surface-2)}
.rolebtn.county{grid-column:1 / -1}
.roleswatch{width:18px;height:18px;border-radius:5px;flex:0 0 18px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.roletxt{display:flex;flex-direction:column;min-width:0}
.roletxt strong{font-size:14.5px;font-weight:600}
.roletxt small{font-size:12px;color:var(--text-faint)}
.whorow{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 12px;background:var(--surface-2);
        border-radius:9px;border:1px solid var(--line)}
.whoname{flex:1;font-weight:600;font-size:14px}
.linkbtn{background:none;border:0;color:var(--training);cursor:pointer;font:inherit;font-size:13px;text-decoration:underline;padding:2px 4px}
.linkbtn:hover{color:var(--text)}
.pinbox{display:flex;gap:8px}
.pinbox input{flex:1;letter-spacing:.4em;font-size:19px;text-align:center;padding:11px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--deep);color:#fff;padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);z-index:80;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
footer.site{text-align:center;color:var(--text-faint);font-size:12.5px;padding:28px 16px 0}

/* ---------- the printable sheet ---------- */
#printout{display:none}
/* shown when the page is opened from the "print in Safari" link */
.printbar{position:sticky;top:0;z-index:70;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
          background:var(--deep);color:#fff;padding:12px 16px;box-shadow:var(--shadow)}
.printbar .pbtxt{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:140px}
.printbar .pbtxt b{font-size:15px}
.printbar .pbtxt span{font-size:12.5px;opacity:.85}
.printbar .btn{background:#fff;color:var(--deep);border-color:#fff}
.printbar .pbnote{flex:1 0 100%;margin:2px 0 0;font-size:11.5px;opacity:.8}
@media print{
  @page{size:A4 portrait;margin:12mm 10mm}
  header.top, .controls, .legend, #navRow, #calView, #tblView, footer.site, .scrim, .toast,
  .printbar{display:none !important}
  html,body{background:#fff !important;color:#000 !important}
  /* gives percentage heights inside a sheet something real to resolve against:
     in paged media this is the page area, whatever the paper and margins are */
  html,body{height:100%}
  /* The palette follows the device theme. A phone in dark mode was therefore
     washing the bars in dark grey-blue and then writing black text on them, on
     white paper. Printing always uses the light values. Tripled :root to beat
     the dark-mode block's specificity rather than relying on source order. */
  :root:root:root{
    --surface:#FFFFFF; --tint:22%; --chip-tint:26%;
    --sec-beavers:#22407F; --sec-cubs:#3B5230; --sec-scouts:#9A4B00;
    --sec-ventures:#7E2049; --sec-rovers:#7A1F2E; --sec-scouters:#5E5C55;
    --group:#9A4B00; --county:#1B4A63; --training:#1B4A63; --national:#3B5230;
  }
  /* the app shell is hidden, but its padding still takes a strip off page one */
  .wrap{padding:0 !important;margin:0 !important}
  /* height:100% here is what lets a sheet inside ask for "exactly one page":
     a percentage height needs a parent with a definite one to resolve against,
     and without it the poster quietly fell back to its natural height. */
  #printout{display:block;height:100%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .psheet{page-break-after:always}
  .psheet:last-child{page-break-after:auto}
  .phead{display:flex;align-items:center;gap:12px;border-bottom:3px solid #1B4A63;padding-bottom:8px;margin-bottom:12px}
  .phead img{width:52px;height:auto;border:1px solid #ccc;border-radius:4px}
  .phead h1{margin:0;font-size:17pt;color:#1B4A63;text-transform:uppercase;letter-spacing:.01em}
  .phead p{margin:2px 0 0;font-size:10pt;color:#333}
  .phead .pwho{margin-left:auto;text-align:right;font-size:11pt;font-weight:700;color:#000}
  .phead .pwho small{display:block;font-weight:400;font-size:8.5pt;color:#555}
  .pmonths{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm 5mm}
  .pmonth{break-inside:avoid}
  .pmonth h3{margin:0 0 2px;font-size:9pt;border-bottom:1px solid #999;padding-bottom:1px}
  .pdows{display:grid;grid-template-columns:repeat(7,1fr);background:#eee;border:1px solid #bbb;border-bottom:0}
  .pdows span{text-align:center;font-weight:700;font-size:6.5pt;padding:1.2px 0;color:#333}
  .pweeks{border:1px solid #bbb}
  .pweek{position:relative}
  .pweek + .pweek{border-top:1px solid #ddd}
  .pwbg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
  .pwbg i{border-right:1px solid #ddd}
  .pwbg i:last-child{border-right:0}
  .pwbg i.pwout{background:#f5f5f5}
  .pwgrid{position:relative;display:grid;grid-template-columns:repeat(7,1fr);row-gap:.5mm;
          padding:.5mm 0 .8mm;min-height:7.4mm;align-content:start}
  .pdnum{grid-row:1;font-size:6.6pt;text-align:right;padding:0 1.2px;line-height:1.15}
  .pdnum.pout{color:#bbb}
  .pdnum.ptoday{font-weight:700;text-decoration:underline}
  /* the mark itself: a filled block for one day, a continuous bar across many */
  .pbar{height:1.7mm;border-radius:.5mm;margin:0 .4mm;
        -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pbar.pcl{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
  .pbar.pcr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
  /* the one-page handout for each section */
  .gurl{background:#1B4A63;color:#fff;text-align:center;padding:3.5mm 2mm;border-radius:2mm;margin:0 0 4mm;
        -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .gurl b{display:block;font-size:19pt;letter-spacing:.01em;line-height:1.1}
  .gurl span{display:block;font-size:8.5pt;opacity:.85;margin-top:1mm}
  .gpin{border:1.2pt solid #1B4A63;border-radius:2mm;padding:2.5mm 3mm;margin:0 0 4mm;display:flex;
        align-items:center;gap:3mm}
  .gpin .glab{font-size:8.5pt;color:#333;flex:1}
  .gpin .gnum{font-size:20pt;font-weight:700;letter-spacing:.12em;color:#1B4A63;font-variant-numeric:tabular-nums}
  .gcols{column-count:2;column-gap:7mm}
  .gstep{break-inside:avoid;margin:0 0 3.5mm}
  .gstep h4{margin:0 0 1mm;font-size:9.5pt;color:#1B4A63;display:flex;gap:2mm;align-items:baseline}
  .gstep h4 i{font-style:normal;background:#1B4A63;color:#fff;border-radius:50%;width:4.6mm;height:4.6mm;
              display:inline-flex;align-items:center;justify-content:center;font-size:7pt;flex:0 0 4.6mm;
              -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .gstep p{margin:0 0 1mm;font-size:8.3pt;line-height:1.4;color:#222}
  .gstep ul{margin:.5mm 0 0;padding-left:4mm;font-size:8.3pt;line-height:1.4;color:#222}
  .gstep li{margin-bottom:.8mm}
  .gstep b{color:#000}
  .gnote{font-size:8pt;color:#444;background:#F4F1EA;border-left:1mm solid #1B4A63;padding:2mm 2.5mm;
         border-radius:0 1mm 1mm 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* the single-month wall sheet: landscape-ish proportions, big cells */
  .bigmonth{display:flex;flex-direction:column;height:196mm;overflow:hidden;break-inside:avoid}
  .bigtitle{margin:0 0 2mm;font-size:19pt;color:#1B4A63;letter-spacing:-.01em}
  .bigdows{display:grid;grid-template-columns:repeat(7,1fr);background:#1B4A63;border-radius:1.5mm 1.5mm 0 0;
           -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bigdows span{text-align:center;font-size:8.5pt;font-weight:700;color:#fff;padding:1.8mm 0;letter-spacing:.04em}
  .bigweeks{display:grid;flex:1;min-height:0;border:1px solid #999;border-top:0;break-inside:avoid}
  .bigweek{position:relative;border-bottom:1px solid #ccc;min-height:0;break-inside:avoid}
  .bigweek:last-child{border-bottom:0}
  .bigbg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
  .bigbg i{border-right:1px solid #e2e2e2}
  .bigbg i:last-child{border-right:0}
  .bigbg i.bigout{background:#f7f7f7}
  .biggrid{position:relative;display:grid;grid-template-columns:repeat(7,1fr);row-gap:.8mm;
           padding:1mm 0 1mm;align-content:start;height:100%}
  .bignum{grid-row:1;font-size:11pt;font-weight:700;color:#333;text-align:right;padding:0 1.5mm .5mm}
  .bignum.out{color:#c4c4c4;font-weight:400}
  .bigbar{border-radius:0 1mm 1mm 0;margin:0 1mm 0 .6mm;padding:.6mm 1.5mm;
          overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bigbar.cl{margin-left:0;border-radius:0 1mm 1mm 0}
  .bigbar.cr{margin-right:0;border-radius:0}
  /* wrap to two lines rather than truncate: on a wall sheet the name matters */
  .bigbartxt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
             font-size:7.6pt;font-weight:600;line-height:1.2;color:#111;overflow:hidden}
  .bigbartxt em{font-style:normal;font-weight:400;color:#444}
  .bigweek.tight .bigbartxt{-webkit-line-clamp:1;font-size:7.2pt}
  /* the A3 poster: the whole year on one sheet, names written into the days.
     A3 landscape gives a wider day cell than portrait (about 2mm more), and on a
     14mm-wide cell every millimetre is another character of the event name. */
  .a3sheet .phead h1{font-size:20pt}
  .a3sheet .phead{margin-bottom:2.5mm}
  .a3sheet .pkey{font-size:8.5pt;margin:0 0 2.5mm}
  .a3sheet .pfoot{margin-top:3mm}
  /* Landscape puts the year in four columns of three; portrait in three of four.
     iOS Safari ignores the @page size and orientation entirely and prints to
     whatever paper AirPrint has, always portrait, so the portrait layout is the
     only one that comes out the right shape there, and it is the default on
     iPhones and iPads. On a portrait page the months are taller and slightly
     narrower; on landscape, wider and shorter. */
  /* The poster must fill exactly one page and never spill onto a second, and it
     cannot know how tall that page is: the paper is whatever the user picked,
     and browsers apply their own margins regardless of what @page asks for,
     Safari on iOS notably uses margins of its own, which is what pushed a
     fixed-height poster onto a second sheet. So no fixed heights. In paged
     media a percentage height resolves against the page area, so the sheet is
     told to be exactly one page tall and the grid simply takes whatever is left
     after the heading and the footer. Any paper, any margins, one page. */
  .psheet.a3sheet{height:100%;display:flex;flex-direction:column;overflow:hidden}
  /* Authored at twice size and scaled to half.

     A year on one sheet needs type around 5pt. iOS will not render type that
     small: it applies a minimum font size, which lifts the day numbers and event
     names but leaves the headings alone, so the poster came off an iPhone with
     its small text inflated to nearly heading size while the grid stayed put.
     -webkit-text-size-adjust does not govern that floor.

     A transform does. Everything inside is specified at double (10.4pt text in
     a box twice as wide) and the whole thing is scaled by half, which is a
     geometric operation the font machinery never sees. The computed font size
     stays comfortably above any floor; the printed result is the 5.2pt it always
     was. Vector either way, so nothing is rasterised or softened. */
  .poster{flex:1;min-height:0;position:relative}
  .posterScale{position:absolute;top:0;left:0;width:200%;height:200%;
               transform:scale(.5);transform-origin:0 0;
               display:grid;grid-auto-rows:minmax(0,1fr);gap:7mm 8mm}
  .posterScale.pland{grid-template-columns:repeat(4,1fr)}
  .posterScale.pport{grid-template-columns:repeat(3,1fr)}
  .pomonth{display:flex;flex-direction:column;min-height:0;break-inside:avoid}
  .poh{margin:0 0 1.6mm;font-size:18pt;color:#1B4A63;border-bottom:2.4px solid #1B4A63;
       padding-bottom:1mm;letter-spacing:0}
  .podows{display:grid;grid-template-columns:repeat(7,1fr);background:#eef1f7;border:2px solid #bbb;
          border-bottom:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .podows span{text-align:center;font-weight:700;font-size:12pt;padding:1.2mm 0;color:#334}
  .poweeks{display:grid;grid-auto-rows:minmax(0,1fr);flex:1;min-height:0;border:2px solid #bbb;border-top:0}
  .poweek{position:relative;min-height:0;overflow:hidden}
  .poweek + .poweek{border-top:2px solid #ddd}
  .pobg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
  .pobg i{border-right:2px solid #e4e4e4}
  .pobg i:last-child{border-right:0}
  .pobg i.poout{background:#f7f7f7}
  .pogrid{position:relative;display:grid;grid-template-columns:repeat(7,1fr);row-gap:.8mm;
          padding:.6mm 0 .8mm;align-content:start;height:100%}
  .ponum{grid-row:1;font-size:11.6pt;text-align:right;padding:0 1mm;line-height:1.1;color:#333}
  .ponum.out{color:#c8c8c8}
  .pobar{border-radius:0 1.2mm 1.2mm 0;margin:0 .4mm 0 .3mm;
         padding:.3mm .7mm;overflow:hidden;
         -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pobar.cl{margin-left:0;border-radius:0 1.2mm 1.2mm 0}
  .pobar.cr{margin-right:0;border-radius:0}
  .pobartxt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
            font-size:10.4pt;line-height:1.12;font-weight:600;color:#111;
            overflow-wrap:anywhere;hyphens:auto}
  /* Lane count decides how many lines each name gets. A week with one event has
     the whole cell to itself, so it can run to three lines and most names
     survive intact; three overlapping events have to share, so they get one. */
  .poweek.tight .pobartxt{-webkit-line-clamp:1}
  .poweek.roomy .pobartxt{-webkit-line-clamp:3}
  .pkey{display:flex;flex-wrap:wrap;gap:1.5mm 5mm;margin:0 0 4mm;font-size:7.5pt;color:#333}
  .pkey span{display:inline-flex;align-items:center;gap:1.5mm}
  .pkey i{width:5mm;height:2.4mm;border-radius:.5mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .plist{margin-top:6mm}
  .plist h3{margin:0 0 4px;font-size:11pt;border-bottom:1px solid #999;padding-bottom:2px}
  .ptable{width:100%;border-collapse:collapse;font-size:8.5pt;table-layout:fixed}
  .ptable th{text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:.05em;color:#444;
             border-bottom:1px solid #999;padding:3px 4px}
  .ptable td{padding:3.5px 4px;border-bottom:1px solid #ddd;vertical-align:top}
  .ptable tr{break-inside:avoid}
  .ptable .pw{white-space:nowrap;font-weight:700}
  .ptable .pmeta{color:#444}
  .pempty{font-size:9pt;color:#555;font-style:italic;margin-top:6mm}
  .pfoot{margin-top:6mm;border-top:1px solid #ccc;padding-top:3px;font-size:7.5pt;color:#666;display:flex;justify-content:space-between}
}

/* ---------- mobile: a real month grid, tapped a day at a time ---------- */
.secsel{display:none}
.mcal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.mdow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface-2);border-bottom:1px solid var(--line)}
.mdow span{padding:6px 0;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.mcell{position:relative;background:none;border:0;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
       min-height:46px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text);font:inherit}
.mcell:nth-child(7n){border-right:0}
.mcell.out .mnum{opacity:.38}
.mnum{font-size:13px;font-weight:600;width:24px;height:24px;line-height:24px;border-radius:50%;text-align:center}
.mcell.today .mnum{background:var(--accent);color:var(--on-accent)}
.mcell.sel{background:var(--surface-2)}
.mcell.sel .mnum{box-shadow:0 0 0 2px var(--accent)}
.mcell.sel.today .mnum{box-shadow:none}
.mdots{display:flex;gap:3px;align-items:center;min-height:7px;flex-wrap:wrap;justify-content:center;max-width:100%}
.mdots i{width:6px;height:6px;border-radius:50%;font-style:normal;flex:0 0 6px}
.mdots b{font-size:9px;font-weight:700;color:var(--text-faint);line-height:6px}
.mday{margin-top:14px}
.mday h3{margin:0 0 9px;font-size:15px}
.mday h3 span{color:var(--text-faint);font-weight:400;font-size:13px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.mev{position:relative;display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;border:1px solid var(--line);
     border-radius:10px;background:var(--surface);padding:10px 12px 10px 15px;margin-bottom:8px;cursor:pointer;color:var(--text);font:inherit}
.mev .edge{position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:9px 0 0 9px}
.mev-main{flex:1;min-width:0}
.mev-name{display:block;font-weight:600;font-size:14px;line-height:1.3}
.mev-meta{display:block;font-size:12.5px;color:var(--text-soft);margin-top:2px}
.mev-secs{display:block;font-size:12px;color:var(--text-faint);margin-top:3px}

@media (max-width:560px){
  header.top .wrap{gap:10px;padding-top:12px;padding-bottom:12px}
  .mark{width:46px;flex:0 0 46px;border-radius:6px;padding:2px}
  .brand{flex:1 1 auto;min-width:0}
  .brand h1{font-size:14px;letter-spacing:0;line-height:1.2}
  .brand p{display:none}
  header.top .wrap{padding-top:10px;padding-bottom:10px;gap:9px}
  .mark{width:38px;flex:0 0 38px}
  /* the two utility buttons become icons so the county name stays on one line */
  .ghost-btn .wide{display:none}
  #btnPrint .lbltxt, #btnIcsAll .lbltxt{display:none}
  #btnPrint .ico, #btnIcsAll .ico{display:block}
  #btnPrint, #btnIcsAll{padding:7px 9px}
  .ghost-btn{padding:6px 10px;font-size:12.5px}
  .brand h1{font-size:14px}
  .top-actions{gap:6px}
  .ghost-btn{padding:6px 9px;font-size:12.5px;white-space:nowrap}
  .controls{padding:12px}
  .month-nav h2{min-width:0;flex:1}
  .modal header{padding:14px 16px}
  .modal .body{padding:14px 16px}
  .arow{flex-wrap:wrap;gap:7px}
  .arow .nm{order:-1;flex:1 1 100%}
  .arow .when{min-width:0;font-size:12px}
  .arow .tag{margin-right:auto}
}
@media (max-width:720px){
  .cal{display:none}
  .agenda{display:block}
  .month-nav h2{min-width:0;font-size:17px;flex:1}
  /* the pill wall becomes one dropdown */
  #sectionPills{display:none}
  .secsel{display:block;flex:1 1 auto;min-width:0;padding:9px 11px;border:1px solid var(--line);
          border-radius:9px;background:var(--surface-2);color:var(--text);font-weight:600}
  .lbl{display:none}
  .controls{padding:10px;margin:12px 0}
  .ctl-row{gap:8px}
  .ctl-row + .ctl-row{margin-top:8px;padding-top:8px}
  .seg button{padding:8px 13px}
  #countNote{display:none}
  #today{padding:6px 12px !important;font-size:13.5px}
  #navRow{margin:10px 0 8px !important;gap:6px}
  .icon-btn{width:32px;height:32px}
  .controls{margin:10px 0}
  .legend{gap:5px 12px;font-size:12px;margin-bottom:8px}
  .legend span{font-size:12px}
  .two,.three{grid-template-columns:1fr}
  .rolegrid{grid-template-columns:1fr}
  dl.detail{grid-template-columns:1fr;gap:3px 0}
  dl.detail dd{margin-bottom:9px}
  .mgroup{margin-top:14px}
  .mgroup:first-child{margin-top:4px}
  .mgroup h3{margin:0 0 7px;font-size:12px;letter-spacing:.07em}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .wrap{padding-bottom:40px}

  .tbl td:last-child{padding-bottom:11px}
}

/* ---------------------------------------------------------------------
   7th Clare Scouts: the Burren palette mapped onto the calendar's own
   variable names, so every rule above keeps working unchanged. Light first,
   then the same swap for dark, matching the order the original uses. */
:root{
  --sky:#2E6F8E; --deep:#1B4A63; --sun:#F07800; --grass:#5C7A4A; --dolmen:#51432C; --stone:#9A968C;
  --bg:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFEBE2; --line:#D3CFC4; --line-soft:#E8E4DA;

  --sec-beavers:#22407F; --sec-cubs:#3B5230; --sec-scouts:#9A4B00; --sec-ventures:#7E2049;
  --sec-rovers:#7A1F2E; --sec-scouters:#5E5C55;
  --on-accent:#FFFFFF; --accent:var(--deep); --tint:22%; --chip-tint:26%;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14181B; --surface:#1C2226; --surface-2:#242B30; --line:#39434A; --line-soft:#2C343A;
    --text:#ECE8DF; --text-soft:#B4AFA4; --text-faint:#8A857B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px -14px rgba(0,0,0,.75);
    --group:#FFB366;    --group-tint:#3A2410;    --group-edge:#F07800;
    --county:#8FB7C9;   --county-tint:#12303D;   --county-edge:#2E6F8E;

    --national:#A9C48F; --national-tint:#1E2A17; --national-edge:#5C7A4A;
    --sec-beavers:#8FA8DC; --sec-cubs:#9CC182; --sec-scouts:#F0A45A; --sec-ventures:#E094AB;
    --sec-rovers:#E0705F; --sec-scouters:#B4AFA4;
    --on-accent:#14181B; --accent:#8FB7C9;
  }
}

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- config */
/* The group's own calendar. Events come from the same content the app reads,
   so anything approved here shows on the app's Calendar tab too. */
var API = '/.netlify/functions/content';
var SITE_ADDRESS = '7thclarescouts.ie/calendar';
var HELP_CONTACT = { name:'7th Clare Scouts', phone:'', how:'7thclarescouts@gmail.com' };
function siteAddress(){ return SITE_ADDRESS || location.host; }

var SECTIONS = [
  {id:'beavers',  name:'Beavers',  colour:'var(--sec-beavers)'},
  {id:'cubs',     name:'Cubs',     colour:'var(--sec-cubs)'},
  {id:'scouts',   name:'Scouts',   colour:'var(--sec-scouts)'},
  {id:'ventures', name:'Ventures', colour:'var(--sec-ventures)'}
];
var SEC_BY_ID = {}; SECTIONS.forEach(function(s){ SEC_BY_ID[s.id]=s; });
var ALL_SECTION_IDS = SECTIONS.map(function(s){return s.id;});

var CATEGORIES = [
  {id:'group',  name:'Ours',   swatch:'var(--group-edge)'},
  {id:'county', name:'County', swatch:'var(--county-edge)'}
];

var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

/* ---------------------------------------------------------------- state */
var state = {
  events: [],
  updatedAt: null,
  section: 'all',
  view: 'cal',
  apiDown: false,
  stale: false,
  selDay: null,
  range: 'upcoming',
  cursor: startOfMonth(new Date())
};

/* ---------------------------------------------------------------- utils */
function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){ var n=document.createElement(tag); if(cls) n.className=cls; if(txt!=null) n.textContent=txt; return n; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function iso(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseISO(s){ var p=String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayISO(){ return iso(new Date()); }
function fmtDay(s){ var d=parseISO(s); return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3); }
function fmtLong(s){ var d=parseISO(s); return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(); }
// The hours an event runs, as people write them here: "6:00 to 7:30 pm",
// "11:00 am to 1:00 pm", "7:00 pm". Events made before there were real times
// carry only the free text a leader typed, so that is the fallback. Kept
// identical in index.html, calendar.html and lab/rota-lib.js;
// tools/test-times.mjs holds the three copies together.
function eventWhen(e){
  var ok = function(x){ return /^([01]\d|2[0-3]):[0-5]\d$/.test(x || "") ? x : ""; };
  var s = ok(e.startTime), f = ok(e.endTime);
  if (!s) return e.time || "";
  var say = function(x, ampm){ var h = +x.slice(0, 2), g = ((h + 11) % 12) + 1; return g + ":" + x.slice(3) + (ampm ? (h < 12 ? " am" : " pm") : ""); };
  if (!f) return say(s, true);
  // The start says am or pm of its own only when the end's would not do for
  // both: across noon, or across midnight onto a later day.
  var half = function(x){ return +x.slice(0, 2) < 12; };
  var days = !!e.endDate && e.endDate !== e.date;
  return say(s, days || half(s) !== half(f)) + " to " + say(f, true);
}
function fmtRange(ev){
  if(!ev.end || ev.end===ev.start) return fmtLong(ev.start);
  var a=parseISO(ev.start), b=parseISO(ev.end);
  if(a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear())
    return a.getDate()+'–'+b.getDate()+' '+MONTHS[a.getMonth()]+' '+a.getFullYear();
  return fmtDay(ev.start)+' – '+fmtLong(ev.end);
}
function fmtRangeShort(ev){
  if(!ev.end || ev.end===ev.start) return fmtDay(ev.start);
  return fmtDay(ev.start)+' – '+fmtDay(ev.end);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function catName(id){ for(var i=0;i<CATEGORIES.length;i++) if(CATEGORIES[i].id===id) return CATEGORIES[i].name; return 'County'; }
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('on'); }, 2400);
}
function daysBetween(startISO, endISO){
  var out=[], d=parseISO(startISO), last=parseISO(endISO||startISO);
  var guard=0;
  while(d<=last && guard++<400){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}
function sectionLabel(ev){
  if(!ev.sections || ev.sections.length===0 || ev.sections.length===SECTIONS.length) return 'All Sections';
  return ev.sections.map(function(id){ return SEC_BY_ID[id] ? SEC_BY_ID[id].name : id; }).join(', ');
}

/* ---------------------------------------------------------------- filtering */
function visible(){
  return state.events.filter(function(ev){
    if(state.section!=='all'){
      var secs = (ev.sections && ev.sections.length) ? ev.sections : ALL_SECTION_IDS;
      if(secs.indexOf(state.section)===-1) return false;
    }
    return true;
  });
}
function sortByDate(a,b){ return a.start<b.start ? -1 : a.start>b.start ? 1 : a.name.localeCompare(b.name); }

/* ---------------------------------------------------------------- controls */
function buildControls(){
  var sp=$('sectionPills'); sp.innerHTML='';
  var mk=function(id,name,colour){
    var b=el('button','pill'); b.type='button';
    b.setAttribute('aria-pressed', String(state.section===id));
    if(colour){ var d=el('span','dot'); d.style.background=colour; b.appendChild(d); }
    b.appendChild(document.createTextNode(name));
    b.onclick=function(){ state.section=id; buildControls(); render(); };
    sp.appendChild(b);
  };
  mk('all','All Sections',null);
  SECTIONS.forEach(function(s){ mk(s.id, s.name, s.colour); });

  var sel=$('secSelect');
  if(!sel.options.length){
    [{id:'all',name:'All Sections'}].concat(SECTIONS).forEach(function(o){
      var opt=el('option',null,o.name); opt.value=o.id; sel.appendChild(opt);
    });
    sel.onchange=function(){ state.section=sel.value; buildControls(); render(); };
  }
  sel.value = state.section;

  var lg=$('legend');
  if(!lg.childNodes.length){
    SECTIONS.forEach(function(sec){
      var item=el('span');
      var sw=el('i'); sw.style.background=sec.colour;
      item.appendChild(sw); item.appendChild(document.createTextNode(sec.name));
      lg.appendChild(item);
    });
  }
}

/* ---------------------------------------------------------------- render */
function render(){
  $('viewCal').setAttribute('aria-pressed', String(state.view==='cal'));
  $('viewTbl').setAttribute('aria-pressed', String(state.view==='tbl'));
  $('calView').hidden = state.view!=='cal';
  $('tblView').hidden = state.view!=='tbl';
  $('navRow').style.display = state.view==='cal' ? '' : 'none';
  if(state.view==='cal') renderCalendar(); else renderTable();
  $('stamp').textContent = state.updatedAt
    ? 'Last updated ' + new Date(state.updatedAt).toLocaleString('en-IE', {dateStyle:'medium', timeStyle:'short'})
    : '';
}

var MAX_LANES = 4;

// The phone layout is a different layout, not a squeezed one, so the render
// path forks here and re-runs when the viewport crosses the breakpoint.
var MOBILE_Q = window.matchMedia('(max-width:720px)');
function isPhone(){ return MOBILE_Q.matches; }
if(MOBILE_Q.addEventListener) MOBILE_Q.addEventListener('change', function(){ render(); });
else if(MOBILE_Q.addListener) MOBILE_Q.addListener(function(){ render(); });

function addDays(d, n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function dayGap(fromDate, isoStr){
  return Math.round((parseISO(isoStr) - fromDate) / 86400000);
}
function secsOf(ev){
  return (ev.sections && ev.sections.length) ? ev.sections : ALL_SECTION_IDS;
}
// The left edge carries the section. One section is a solid block; several
// sections stack into hard-edged stripes so a joint event still reads at a glance.
function sectionPaint(secs){
  if(secs.length === 1) return SEC_BY_ID[secs[0]].colour;
  var n = secs.length, stops = [];
  secs.forEach(function(id, i){
    var c = SEC_BY_ID[id].colour;
    stops.push(c + ' ' + (i*100/n).toFixed(2) + '% ' + ((i+1)*100/n).toFixed(2) + '%');
  });
  return 'linear-gradient(180deg,' + stops.join(',') + ')';
}
function sectionTint(secs, strength){
  if(secs.length !== 1) return null;              // all-sections events stay neutral
  return 'color-mix(in srgb, ' + SEC_BY_ID[secs[0]].colour + ' var(' + (strength||'--tint') + '), var(--surface))';
}

function renderCalendar(){
  var evs = visible();
  var cur = state.cursor;
  $('monthLabel').textContent = MONTHS[cur.getMonth()]+' '+cur.getFullYear();

  var first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  var offset = (first.getDay()+6)%7;           // Monday-first
  var gridStart = new Date(first); gridStart.setDate(1-offset);

  var monthCount = evs.filter(function(ev){
    return daysBetween(ev.start,ev.end).some(function(d){
      var p=parseISO(d); return p.getMonth()===cur.getMonth() && p.getFullYear()===cur.getFullYear();
    });
  }).length;
  $('countNote').textContent = monthCount + (monthCount===1?' event':' events') + ' this month';

  var grid=$('grid'); grid.innerHTML='';
  var tISO = todayISO();

  for(var w=0; w<6; w++){
    var weekStart = addDays(gridStart, w*7);
    var wsISO = iso(weekStart), weISO = iso(addDays(weekStart, 6));

    var week = el('div','week');

    var bg = el('div','week-bg');
    for(var i=0;i<7;i++){
      var d = addDays(weekStart, i);
      bg.appendChild(el('span', d.getMonth()!==cur.getMonth() ? 'out' : null));
    }
    week.appendChild(bg);

    var wg = el('div','week-grid');
    for(var i=0;i<7;i++){
      var d = addDays(weekStart, i), key = iso(d);
      var n = el('span','dnum'+(d.getMonth()!==cur.getMonth()?' out':'')+(key===tISO?' today':''), String(d.getDate()));
      n.style.gridColumn = String(i+1);
      wg.appendChild(n);
    }

    // Everything overlapping this week, clipped to it.
    var items = evs.filter(function(ev){
      return ev.start <= weISO && (ev.end||ev.start) >= wsISO;
    }).map(function(ev){
      var evEnd = ev.end || ev.start;
      var s = ev.start > wsISO ? ev.start : wsISO;
      var e = evEnd    < weISO ? evEnd    : weISO;
      return {
        ev: ev,
        c1: dayGap(weekStart, s) + 1,
        c2: dayGap(weekStart, e) + 1,
        clipL: ev.start < wsISO,
        clipR: evEnd    > weISO
      };
    }).sort(function(a,b){
      if(a.c1 !== b.c1) return a.c1 - b.c1;
      var la = a.c2-a.c1, lb = b.c2-b.c1;
      if(la !== lb) return lb - la;              // longer camps take the top lane
      return a.ev.name.localeCompare(b.ev.name);
    });

    // Pack into lanes so nothing overlaps, and count what did not fit.
    var lanes = [], overflow = [0,0,0,0,0,0,0];
    items.forEach(function(it){
      var lane = 0;
      while(lane < MAX_LANES){
        var taken = (lanes[lane]||[]).some(function(r){ return it.c1 <= r.c2 && it.c2 >= r.c1; });
        if(!taken) break;
        lane++;
      }
      if(lane >= MAX_LANES){
        for(var c=it.c1; c<=it.c2; c++) overflow[c-1]++;
        return;
      }
      (lanes[lane] = lanes[lane] || []).push(it);
      var bar = makeBar(it);
      bar.style.gridColumn = it.c1 + ' / span ' + (it.c2 - it.c1 + 1);
      bar.style.gridRow = String(lane + 2);
      wg.appendChild(bar);
    });

    for(var c=0;c<7;c++){
      if(overflow[c] > 0){
        var m = el('button','moreb','+'+overflow[c]+' more');
        m.style.gridColumn = String(c+1);
        m.style.gridRow = String(MAX_LANES + 2);
        (function(dk){ m.onclick=function(){ openDay(dk); }; })(iso(addDays(weekStart, c)));
        wg.appendChild(m);
      }
    }

    week.appendChild(wg);
    grid.appendChild(week);
  }

  renderAgenda(evs, cur);
}

function makeBar(it){
  var ev = it.ev, secs = secsOf(ev), span = it.c2 - it.c1 + 1;
  var b = el('button','bar'+(it.clipL?' cl':'')+(it.clipR?' cr':''));
  b.type = 'button';

  var edge = el('span','edge');
  edge.style.background = sectionPaint(secs);
  b.appendChild(edge);

  var lbl = el('span','btxt');
  lbl.textContent = ev.name;
  if(span >= 2 && ev.time) lbl.appendChild(el('em', null, '  ·  ' + ev.time));
  b.appendChild(lbl);

  b.style.background = 'var(--surface-2)';
  var tint = sectionTint(secs);
  if(tint) b.style.background = tint;           // ignored if color-mix is unsupported

  b.title = ev.name + '\n' + sectionLabel(ev) + ' · ' + catName(ev.category) +
            (ev.time ? ' · ' + ev.time : '') + '\n' + fmtRange(ev);
  b.onclick = function(){ openEvent(ev); };
  return b;
}

function renderAgenda(evs, cur){
  var box=$('agenda'); box.innerHTML='';
  if(state.apiDown){ box.appendChild(apiDownBox()); return; }

  var first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  var offset = (first.getDay()+6)%7;
  var gridStart = new Date(first); gridStart.setDate(1-offset);
  var tISO = todayISO();

  // which days have what
  var byDay = {};
  evs.forEach(function(ev){
    daysBetween(ev.start, ev.end).forEach(function(d){ (byDay[d]=byDay[d]||[]).push(ev); });
  });

  // keep the selected day sensible when the month changes
  var inThisMonth = state.selDay &&
    parseISO(state.selDay).getMonth()===cur.getMonth() &&
    parseISO(state.selDay).getFullYear()===cur.getFullYear();
  if(!inThisMonth){
    var todayHere = parseISO(tISO).getMonth()===cur.getMonth() && parseISO(tISO).getFullYear()===cur.getFullYear();
    if(todayHere) state.selDay = tISO;
    else {
      var firstBusy = Object.keys(byDay).filter(function(d){
        var p=parseISO(d); return p.getMonth()===cur.getMonth() && p.getFullYear()===cur.getFullYear();
      }).sort()[0];
      state.selDay = firstBusy || iso(first);
    }
  }

  var cal = el('div','mcal');
  var dow = el('div','mdow');
  ['M','T','W','T','F','S','S'].forEach(function(d){ dow.appendChild(el('span',null,d)); });
  cal.appendChild(dow);

  var grid = el('div','mgrid');
  for(var i=0;i<42;i++){
    var d = addDays(gridStart, i), key = iso(d);
    var out = d.getMonth()!==cur.getMonth();
    var cell = el('button','mcell'+(out?' out':'')+(key===tISO?' today':'')+(key===state.selDay?' sel':''));
    cell.type='button';
    cell.setAttribute('aria-label', fmtLong(key));
    cell.appendChild(el('span','mnum', String(d.getDate())));

    var list = (byDay[key]||[]).slice().sort(sortByDate);
    var dots = el('span','mdots');
    list.slice(0,4).forEach(function(ev){
      var dot = el('i');
      dot.style.background = sectionPaint(secsOf(ev));
      dots.appendChild(dot);
    });
    if(list.length>4) dots.appendChild(el('b',null,'+'));
    cell.appendChild(dots);

    (function(k){ cell.onclick=function(){ state.selDay=k; renderAgenda(visible(), state.cursor); }; })(key);
    grid.appendChild(cell);
  }
  cal.appendChild(grid);
  box.appendChild(cal);

  // the day itself
  var day = el('div','mday');
  var list = (byDay[state.selDay]||[]).slice().sort(sortByDate);
  var h = el('h3', null, fmtLong(state.selDay) + ' ');
  h.appendChild(el('span', null, list.length ? '· ' + list.length + (list.length===1?' event':' events') : ''));
  day.appendChild(h);

  if(!list.length){
    day.appendChild(el('p','note','Nothing on this day. Tap another, or use the table view for everything coming up.'));
  } else {
    list.forEach(function(ev){ day.appendChild(dayCard(ev)); });
  }
  box.appendChild(day);
}

function fmtCardDate(ev){
  var d = parseISO(ev.start);
  if(!ev.end || ev.end === ev.start){
    return DAYS[d.getDay()].slice(0,3) + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0,3);
  }
  return fmtRangeShort(ev);
}

function dayCard(ev, showDate){
  var secs = secsOf(ev);
  var b = el('button','mev'); b.type='button';

  var edge = el('span','edge');
  edge.style.background = sectionPaint(secs);
  b.appendChild(edge);

  var main = el('span','mev-main');
  var nm = el('span','mev-name', ev.name);
  main.appendChild(nm);

  var bits = [];
  if(showDate) bits.push(fmtCardDate(ev));
  else if(ev.end && ev.end!==ev.start) bits.push(fmtRangeShort(ev));
  if(ev.time) bits.push(ev.time);
  if(ev.location) bits.push(ev.location);
  if(bits.length) main.appendChild(el('span','mev-meta', bits.join('  ·  ')));

  main.appendChild(el('span','mev-secs', sectionLabel(ev)));
  b.appendChild(main);

  b.onclick = function(){ openEvent(ev); };
  return b;
}

function apiDownBox(){
  var local = location.protocol === 'file:';
  return emptyBox(
    local ? 'Open this through the website, not the file' : 'The events service is not responding',
    local
      ? 'This page talks to a function on the site, which cannot run from a file on your computer. Open the Netlify address instead.'
      : 'Check that you dropped the whole unzipped folder onto Netlify, and that Logs then Functions on the site lists an "events" function.');
}
function emptyBox(title, sub){
  var e=el('div','empty');
  e.appendChild(el('strong', null, title));
  e.appendChild(document.createTextNode(sub));
  return e;
}

var TBL_COLS = ['17%','30%','17%','18%','18%'];   // date, event, sections, host, contact

function buildTable(list){
  var t=el('table','tbl');
  var cg=el('colgroup');
  TBL_COLS.forEach(function(w){ var c=el('col'); c.style.width=w; cg.appendChild(c); });
  t.appendChild(cg);
  var thead=el('thead');
  var hr=el('tr');
  ['Date','Event','Sections','Hosted by','Contact'].forEach(function(h){ hr.appendChild(el('th',null,h)); });
  thead.appendChild(hr); t.appendChild(thead);
  var tb=el('tbody');
  list.forEach(function(ev){
    var tr=el('tr');
    tr.onclick=function(){ openEvent(ev); };

    var td1=el('td','when'); td1.appendChild(document.createTextNode(fmtRangeShort(ev)));
    var yr=el('div','sub', parseISO(ev.start).getFullYear() + (ev.time? ' · '+ev.time : ''));
    td1.appendChild(yr); tr.appendChild(td1);

    var td2=el('td');
    var nm=el('div',null,ev.name);
    td2.appendChild(nm);
    if(ev.location) td2.appendChild(el('div','sub', ev.location));
    tr.appendChild(td2);

    var td4=el('td');
    var secs=secsOf(ev);
    if(secs.length===SECTIONS.length){
      var all=el('span','secchip','All Sections');
      all.style.background='var(--surface-2)';
      td4.appendChild(all);
    } else {
      secs.forEach(function(id){
        var sec=SEC_BY_ID[id]; if(!sec) return;
        var c=el('span','secchip');
        var dot=el('i'); dot.style.background=sec.colour;
        c.appendChild(dot); c.appendChild(document.createTextNode(sec.name));
        c.style.background='var(--surface-2)';
        var tint=sectionTint([id],'--chip-tint');
        if(tint) c.style.background=tint;
        td4.appendChild(c);
      });
    }
    tr.appendChild(td4);

    tr.appendChild(el('td', null, ev.host||''));

    var td6=el('td');
    td6.appendChild(document.createTextNode(ev.contactName||''));
    if(ev.contactEmail) td6.appendChild(el('div','sub', ev.contactEmail));
    else if(ev.contactPhone) td6.appendChild(el('div','sub', ev.contactPhone));
    tr.appendChild(td6);

    tb.appendChild(tr);
  });
  t.appendChild(tb);
  return t;
}

function renderTable(){
  var evs=visible().sort(sortByDate);
  if(state.range==='upcoming'){
    var t=todayISO();
    evs=evs.filter(function(ev){ return (ev.end||ev.start) >= t; });
  }
  $('rangeUpcoming').setAttribute('aria-pressed', String(state.range==='upcoming'));
  $('rangeAll').setAttribute('aria-pressed', String(state.range==='all'));

  var wrap=$('tblWrap'); wrap.innerHTML='';
  if(!evs.length){
    wrap.appendChild(state.apiDown ? apiDownBox()
      : emptyBox('No events to show', state.events.length ? 'Adjust the section or type filters above.' : 'The calendar is empty. Use Admin to add the first event.'));
    return;
  }
  var groups={}, order=[];
  evs.forEach(function(ev){
    var d=parseISO(ev.start), k=d.getFullYear()+'-'+d.getMonth();
    if(!groups[k]){ groups[k]=[]; order.push({k:k, label:MONTHS[d.getMonth()]+' '+d.getFullYear()}); }
    groups[k].push(ev);
  });
  var phone = isPhone();
  order.forEach(function(g){
    var sec=el('section','mgroup');
    sec.appendChild(el('h3', null, g.label));
    if(phone){
      groups[g.k].forEach(function(ev){ sec.appendChild(dayCard(ev, true)); });
    } else {
      sec.appendChild(buildTable(groups[g.k]));
    }
    wrap.appendChild(sec);
  });
}

/* ---------------------------------------------------------------- detail */
var currentEvent=null;
function openEvent(ev){
  currentEvent=ev;
  $('evTitle').textContent = ev.name;
  var rows=[
    ['Type','<span class="tag '+ev.category+'">'+esc(catName(ev.category))+'</span>'],
    ['When', esc(fmtRange(ev)) + (ev.time ? ' <span class="sub">· '+esc(ev.time)+'</span>' : '')],
    ['Sections', esc(sectionLabel(ev))]
  ];

  if(ev.host) rows.push(['Hosted by', esc(ev.host)]);

  if(ev.contactPhone) contact.push('<a href="tel:'+esc(ev.contactPhone.replace(/\s/g,''))+'">'+esc(ev.contactPhone)+'</a>');

function openDay(dayKey){

  $('evTitle').textContent = fmtLong(dayKey);

/* ==================================================================
   Spreadsheet in and out.
   An .xlsx is a zip of XML, so both directions are done by hand here
   rather than pulling in a library the site would have to load.
   ================================================================== */

var SHEET_COLS = [
  'Name', 'Start date', 'End date', 'Time', 'Type', 'Sections',
  'Location', 'Link', 'Description', 'Hosted by', 'Contact name', 'Contact email', 'Contact phone'
];

/* ---------------------------------------------------------- zip writing */
var CRC_TABLE = (function(){
  var t = new Uint32Array(256), c, n, k;
  for(n=0;n<256;n++){
    c = n;
    for(k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  var c = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function utf8(strv){ return new TextEncoder().encode(strv); }

// Stored (uncompressed) zip. Fine for a few KB of XML and keeps this small.
function zipStore(files){
  var parts = [], central = [], offset = 0;
  files.forEach(function(f){
    var nameB = utf8(f.name), data = f.data;
    var crc = crc32(data);
    var local = new Uint8Array(30 + nameB.length);
    var dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 0, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameB.length, true); dv.setUint16(28, 0, true);
    local.set(nameB, 30);
    parts.push(local, data);

    var cen = new Uint8Array(46 + nameB.length);
    var cv = new DataView(cen.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameB.length, true);
    cv.setUint32(42, offset, true);
    cen.set(nameB, 46);
    central.push(cen);

    offset += local.length + data.length;
  });

  var cenSize = central.reduce(function(a,c){ return a + c.length; }, 0);
  var end = new Uint8Array(22);
  var ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cenSize, true); ev.setUint32(16, offset, true);

  var all = parts.concat(central, [end]);
  var total = all.reduce(function(a,c){ return a + c.length; }, 0);
  var out = new Uint8Array(total), p = 0;
  all.forEach(function(chunk){ out.set(chunk, p); p += chunk.length; });
  return out;
}

/* ------------------------------------------------------------ xlsx out */
function xesc(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');   // control chars break Excel
}
function colName(n){
  var s='';
  while(n>=0){ s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n/26) - 1; }
  return s;
}

// Every value is written as an inline string. Dates go out as YYYY-MM-DD text,
// which sorts correctly and cannot be misread as day/month or month/day.
function buildXlsx(rows){
  var sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<cols>' +
      '<col min="1" max="1" width="34" customWidth="1"/>' +
      '<col min="2" max="3" width="13" customWidth="1"/>' +
      '<col min="4" max="4" width="15" customWidth="1"/>' +
      '<col min="5" max="5" width="11" customWidth="1"/>' +
      '<col min="6" max="6" width="26" customWidth="1"/>' +
      '<col min="7" max="7" width="24" customWidth="1"/>' +
      '<col min="8" max="8" width="46" customWidth="1"/>' +
      '<col min="9" max="12" width="22" customWidth="1"/>' +
    '</cols><sheetData>';

  rows.forEach(function(row, r){
    sheet += '<row r="'+(r+1)+'">';
    row.forEach(function(cell, c){
      if(cell === '' || cell == null) return;
      sheet += '<c r="'+colName(c)+(r+1)+'" t="inlineStr"'+(r===0?' s="1"':'')+'>' +
               '<is><t xml:space="preserve">'+xesc(cell)+'</t></is></c>';
    });
    sheet += '</row>';
  });
  sheet += '</sheetData></worksheet>';

  var files = [
    {name:'[Content_Types].xml', data: utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>')},
    {name:'_rels/.rels', data: utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>')},
    {name:'xl/workbook.xml', data: utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="Events" sheetId="1" r:id="rId1"/></sheets></workbook>')},
    {name:'xl/_rels/workbook.xml.rels', data: utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>')},
    {name:'xl/styles.xml', data: utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
      '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>' +
      '<borders count="1"><border/></borders>' +
      '<cellStyleXfs count="1"><xf/></cellStyleXfs>' +
      '<cellXfs count="2"><xf xfId="0"/><xf xfId="0" fontId="1" applyFont="1"/></cellXfs>' +
      '</styleSheet>')},
    {name:'xl/worksheets/sheet1.xml', data: utf8(sheet)}
  ];
  return new Blob([zipStore(files)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* ------------------------------------------------------------- xlsx in */
async function inflateRaw(bytes){
  if(typeof DecompressionStream === 'undefined') throw new Error('nodeflate');
  var ds = new DecompressionStream('deflate-raw');
  var stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// Read the zip's central directory rather than scanning local headers, so
// entries written with streaming descriptors still give correct sizes.
async function unzip(buf){
  var b = new Uint8Array(buf), dv = new DataView(b.buffer);
  var eocd = -1;
  for(var i=b.length-22; i>=0 && i>b.length-66000; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('notzip');
  var count = dv.getUint16(eocd+10, true);
  var cenOff = dv.getUint32(eocd+16, true);

  var out = {}, p = cenOff;
  for(var n=0; n<count; n++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    var method = dv.getUint16(p+10, true);
    var csize  = dv.getUint32(p+20, true);
    var nameLen= dv.getUint16(p+28, true);
    var extLen = dv.getUint16(p+30, true);
    var cmtLen = dv.getUint16(p+32, true);
    var lho    = dv.getUint32(p+42, true);
    var name   = new TextDecoder().decode(b.subarray(p+46, p+46+nameLen));

    var lNameLen = dv.getUint16(lho+26, true);
    var lExtLen  = dv.getUint16(lho+28, true);
    var start = lho + 30 + lNameLen + lExtLen;
    var raw = b.subarray(start, start + csize);
    out[name] = method === 0 ? raw : await inflateRaw(raw);
    p += 46 + nameLen + extLen + cmtLen;
  }
  return out;
}

function xmlDoc(bytes){
  return new DOMParser().parseFromString(new TextDecoder().decode(bytes), 'application/xml');
}
function cellRef(ref){                       // "BC12" -> column index 54
  var m = /^([A-Z]+)/.exec(ref || '');
  if(!m) return 0;
  var n = 0;
  for(var i=0;i<m[1].length;i++) n = n*26 + (m[1].charCodeAt(i) - 64);
  return n - 1;
}
function excelSerialToISO(num){
  var ms = Math.round((num - 25569) * 86400000);   // 25569 = 1970-01-01
  var d = new Date(ms);
  if(isNaN(d)) return '';
  return d.toISOString().slice(0,10);
}

async function parseXlsx(buf){
  var files = await unzip(buf);
  var shared = [];
  if(files['xl/sharedStrings.xml']){
    var sdoc = xmlDoc(files['xl/sharedStrings.xml']);
    var sis = sdoc.getElementsByTagName('si');
    for(var i=0;i<sis.length;i++){
      var ts = sis[i].getElementsByTagName('t'), txt = '';
      for(var j=0;j<ts.length;j++) txt += ts[j].textContent;
      shared.push(txt);
    }
  }
  var sheetName = Object.keys(files).filter(function(n){
    return /^xl\/worksheets\/sheet\d+\.xml$/.test(n);
  }).sort()[0];
  if(!sheetName) throw new Error('nosheet');

  var doc = xmlDoc(files[sheetName]);
  var rowEls = doc.getElementsByTagName('row');
  var rows = [];
  for(var r=0;r<rowEls.length;r++){
    var cells = rowEls[r].getElementsByTagName('c'), row = [];
    for(var c=0;c<cells.length;c++){
      var cell = cells[c];
      var idx = cellRef(cell.getAttribute('r'));
      var t = cell.getAttribute('t');
      var val = '';
      if(t === 'inlineStr'){
        var isEl = cell.getElementsByTagName('t');
        for(var k=0;k<isEl.length;k++) val += isEl[k].textContent;
      } else {
        var v = cell.getElementsByTagName('v')[0];
        var raw = v ? v.textContent : '';
        if(t === 's') val = shared[parseInt(raw,10)] || '';
        else if(t === 'b') val = raw === '1' ? 'TRUE' : 'FALSE';
        else val = raw;
      }
      row[idx] = val;
    }
    for(var f=0;f<row.length;f++) if(row[f] === undefined) row[f] = '';
    rows.push(row);
  }
  return rows;
}

/* -------------------------------------------------------------- csv in */
function parseCsv(text){
  text = text.replace(/^﻿/, '');
  var rows = [], row = [], field = '', q = false, i = 0;
  while(i < text.length){
    var ch = text[i];
    if(q){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      field += ch; i++; continue;
    }
    if(ch === '"'){ q = true; i++; continue; }
    if(ch === ','){ row.push(field); field = ''; i++; continue; }
    if(ch === '\r'){ i++; continue; }
    if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += ch; i++;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

/* --------------------------------------------------- rows <-> events */
function eventsToRows(list){
  var rows = [SHEET_COLS.slice()];
  list.slice().sort(sortByDate).forEach(function(ev){
    var secs = secsOf(ev);
    rows.push([
      ev.name,
      ev.start,
      ev.end || '',
      ev.time || '',
      catName(ev.category),
      secs.length === SECTIONS.length ? 'All Sections'
        : secs.map(function(id){ return SEC_BY_ID[id] ? SEC_BY_ID[id].name : id; }).join(', '),
      ev.location || '',
      ev.link || '',
      ev.description || '',
      ev.host || '',
      ev.contactName || '',
      ev.contactEmail || '',
      ev.contactPhone || ''
    ]);
  });
  return rows;
}

var HEADER_ALIASES = {
  name:['name','event','event name','title'],
  start:['start date','start','date','from'],
  end:['end date','end','to','finish'],
  time:['time','times'],
  category:['type','category'],
  sections:['sections','section'],
  location:['location','venue','location / venue','where'],
  link:['link','url','web','website','booking link'],
  description:['description','details','notes'],
  host:['hosted by','host','organiser','organizer'],
  contactName:['contact name','contact'],
  contactEmail:['contact email','email'],
  contactPhone:['contact phone','phone','telephone','mobile']
};

function normHeader(v){ return String(v||'').trim().toLowerCase().replace(/\s+/g,' '); }

function toISODate(v){
  var s = String(v == null ? '' : v).trim();
  if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/^\d+(\.\d+)?$/.test(s)) return excelSerialToISO(parseFloat(s));   // Excel serial
  var m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s);        // d/m/y, Irish order
  if(m){
    var d = +m[1], mo = +m[2], y = +m[3];
    if(y < 100) y += 2000;
    if(d > 31 || mo > 12) return '';
    return y + '-' + String(mo).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  }
  var parsed = new Date(s);
  if(!isNaN(parsed)) return iso(parsed);
  return '';
}

function rowsToEvents(rows){
  var errors = [], events = [];
  if(!rows.length) return {events:events, errors:['The file is empty.']};

  // find the header row (first row that mentions a name-ish and a date-ish column)
  var headerRow = -1, map = {};
  for(var r=0; r<Math.min(rows.length, 10); r++){
    var candidate = {}, hits = 0;
    rows[r].forEach(function(cell, c){
      var h = normHeader(cell);
      for(var key in HEADER_ALIASES){
        if(HEADER_ALIASES[key].indexOf(h) > -1 && candidate[key] === undefined){
          candidate[key] = c; hits++;
        }
      }
    });
    if(candidate.name !== undefined && candidate.start !== undefined){
      headerRow = r; map = candidate; break;
    }
    if(hits > 3){ headerRow = r; map = candidate; }
  }
  if(headerRow < 0 || map.name === undefined || map.start === undefined){
    return {events:events, errors:['Could not find the column headings. The sheet needs at least a "Name" column and a "Start date" column.']};
  }

  var SEC_BY_NAME = {};
  SECTIONS.forEach(function(s){ SEC_BY_NAME[s.name.toLowerCase()] = s.id; SEC_BY_NAME[s.id] = s.id; });

  for(var i = headerRow + 1; i < rows.length; i++){
    var row = rows[i];
    var get = function(key){ return map[key] === undefined ? '' : String(row[map[key]] == null ? '' : row[map[key]]).trim(); };
    var name = get('name');
    var startRaw = get('start');
    if(!name && !startRaw) continue;                       // blank line, skip quietly

    var start = toISODate(startRaw);
    if(!name){ errors.push('Row ' + (i+1) + ': no event name, skipped.'); continue; }
    if(!start){ errors.push('Row ' + (i+1) + ' (' + name + '): could not read the start date "' + startRaw + '", skipped.'); continue; }

    var end = toISODate(get('end'));
    if(end && end < start) end = '';

    var catRaw = get('category').toLowerCase();
    var category = 'county';
    CATEGORIES.forEach(function(c){ if(catRaw.indexOf(c.id) > -1) category = c.id; });

    var secRaw = get('sections');
    var secs = [];
    if(/all/i.test(secRaw) || !secRaw){
      secs = ALL_SECTION_IDS.slice();
    } else {
      secRaw.split(/[,;/]+/).forEach(function(part){
        var id = SEC_BY_NAME[part.trim().toLowerCase()];
        if(id && secs.indexOf(id) === -1) secs.push(id);
      });
      if(!secs.length){
        errors.push('Row ' + (i+1) + ' (' + name + '): sections "' + secRaw + '" not recognised, set to All Sections.');
        secs = ALL_SECTION_IDS.slice();
      }
    }

    events.push(normalise({
      name: name, start: start, end: end, time: get('time'),
      category: category, sections: secs,
      location: get('location'), link: get('link'), description: get('description'), host: get('host'),
      contactName: get('contactName'), contactEmail: get('contactEmail'), contactPhone: get('contactPhone')
    }));
  }
  return {events:events, errors:errors};
}

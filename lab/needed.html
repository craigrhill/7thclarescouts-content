<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Help needed: 7th Clare Scouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rota.css">
</head>
<body>
<header class="appbar"><div class="wrap">
  <a class="back" href="/" aria-label="Back to the 7th Clare Scouts app"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>App</span></a>
  <div class="brand">7th Clare Scouts<small id="strap">Help needed</small></div>
  <span class="pill">Can you help?</span>
</div></header>
<main class="wrap">
  <div id="err" class="banner err" hidden></div>
  <h1 id="title">Where we still need an adult</h1>
  <p class="muted" id="intro"></p>
  <div id="callout" class="banner" hidden></div>
  <div class="card"><div class="gaps" id="list"></div></div>
  <p class="small muted" id="foot"></p>
</main>
<footer class="wrap">No names on this page: only dates and how many are needed. Share it freely. <a href="/">Back to the app</a></footer>

<script src="rota-lib.js"></script>
<script>
/* The link a section lead sends round when they are chasing helpers. It asks
   nobody to sign in and the server never tells it a name: what comes back is
   dates and counts. Whoever can help says so to their lead, who ticks them in
   on the rota. */
let C = null, D = null, KEY = null;
function showErr(m){ $("err").textContent = m; $("err").hidden = !m; }
const sectionName = k => ((C.settings.sections || []).find(x => x.key === k) || {}).name || k;
const needOf = e => (e.need > 0 ? e.need : D.required);
const needQOf = e => {
  const def = e.kind === "e" ? (D.requiredQualifiedEvents || 0) : (D.requiredQualified || 0);
  return Math.min(Number.isFinite(e.needQualified) ? e.needQualified : def, needOf(e));
};
function statusOf(e){
  const short = needOf(e) - e.on, shortQ = needQOf(e) - e.qualified;
  if (short <= 0 && shortQ <= 0) return { cls: "ok", text: "Covered" };
  if (short > 0) return { cls: "", text: `Needs ${short} more`, short: true };
  return { cls: "warn", text: `Needs one with ${QUAL.short}`, short: true };
}
function render(){
  const section = (C.settings.sections || []).find(x => x.key === KEY) || {};
  const list = (D.nights || []).filter(e => !e.off);
  const short = list.filter(e => statusOf(e).short);
  $("strap").textContent = sectionName(KEY);
  $("intro").textContent = list.length
    ? `Every ${sectionName(KEY)} night needs ${D.required} adult${D.required === 1 ? "" : "s"}. These are the ones still short. If you can take one, tell the section leader and they will put you down.`
    : "Nothing is coming up just now.";
  const call = $("callout");
  call.hidden = !list.length;
  if (list.length) {
    call.className = "banner" + (short.length ? "" : " good");
    call.innerHTML = short.length
      ? `<b>${short.length} of ${list.length} still need${short.length === 1 ? "s" : ""} someone.</b>`
      : `<b>All ${list.length} covered.</b> Nothing needed just now, thank you.`;
  }
  $("list").innerHTML = short.map(e => {
    const st = statusOf(e), when = [eventWhen(e), e.location].filter(Boolean).join(", ");
    const title = e.title || (e.kind === "m" ? sectionName(KEY) + " meeting" : "");
    return `<div class="gap ${st.cls}"><span><b>${esc(fmt(e.date))}</b>${title ? ", " + esc(title) : ""}${when ? `<br><span class="small">${esc(when)}</span>` : ""}</span><span class="count">${esc(st.text)}</span></div>`;
  }).join("") || `<div class="empty">${list.length ? "Nothing is short. Thank you." : "No dates yet."}</div>`;
  $("foot").textContent = D.updatedAt ? "As it stood " + fmt(D.updatedAt.slice(0, 10)) + "." : "";
}
async function boot(){
  try {
    C = await loadContent();
    const want = new URLSearchParams(location.search).get("section");
    KEY = ((C.settings.sections || []).some(x => x.key === want) ? want : (C.settings.sections[0] || {}).key) || "";
    const r = await fetch(API + "?a=cover&section=" + encodeURIComponent(KEY), { cache: "no-store" });
    D = await r.json();
    if (!r.ok) throw new Error(D.error || "Error " + r.status);
    render();
  } catch (e) { showErr("The dates could not be loaded. " + e.message); }
}
boot();
</script>
</body>
</html>

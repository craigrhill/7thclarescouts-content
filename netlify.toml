[build]
  publish = "."
  functions = "netlify/functions"

# Uploaded photos live in a Blobs store, behind the content function. A tidy
# path keeps the URL saved in content.json short and independent of the
# function, and the id is the hash of the bytes, so it is safe to cache hard.
[[redirects]]
  from = "/photo/:name"
  to = "/.netlify/functions/content?photo=:name"
  status = 200

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/lab/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Netlify does not know this extension, so it served the manifest as
# application/octet-stream. Chrome parses it anyway and the app installs
# either way, but the right type is one line and stops it reading as a
# download in devtools.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
